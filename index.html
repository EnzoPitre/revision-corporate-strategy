<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Oral Corporate Strategy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,600;9..144,700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F6F1E7; --card:#FFFFFF; --navy:#1E2A4A; --navy2:#2C3A60; --ink:#1F2433; --muted:#6B6F7E;
  --line:#E7E0D2; --soft:#EFE8DA; --ok:#2A9D8F; --bad:#E76F51; --warn:#D98E1F;
  --p1:#2A9D8F; --p2:#E76F51; --p3:#4F4898; --p4:#D98E1F; --p0:#1E2A4A;
  --r:20px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"DM Sans",system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;font-size:15px;line-height:1.5}
h1,h2,h3{font-family:Fraunces,Georgia,serif;margin:0;line-height:1.2;color:var(--navy)}
button{font-family:inherit;font-size:inherit;cursor:pointer;border:0;background:none;color:inherit}
.wrap{max-width:760px;margin:0 auto;padding:16px 16px 110px}
.top{display:flex;align-items:center;justify-content:space-between;margin:6px 2px 14px}
.top .brand{font-weight:700;font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.lang{display:inline-flex;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:3px;gap:2px}
.lang button{padding:4px 10px;border-radius:999px;font-size:12px;font-weight:700;color:var(--muted)}
.lang button.on{background:var(--navy);color:#fff}
.top .right{display:flex;gap:8px;align-items:center}
.top .count{white-space:nowrap;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:5px 12px;font-size:13px;font-weight:600;color:var(--navy)}
.hero{background:var(--navy);color:#fff;border-radius:24px;padding:22px 20px;position:relative;overflow:hidden}
.hero h1{color:#fff;font-size:26px;margin-bottom:6px}
.hero p{margin:0;color:#C9D0E4;font-size:14px}
.hero .actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
.btn{display:inline-flex;align-items:center;gap:8px;padding:11px 16px;border-radius:14px;font-weight:600;font-size:14px}
.btn-light{background:#fff;color:var(--navy)}
.btn-ghost{background:rgba(255,255,255,.12);color:#fff}
.btn-navy{background:var(--navy);color:#fff}
.btn-out{background:var(--card);border:1px solid var(--line);color:var(--navy)}
.sec{margin:26px 2px 10px;display:flex;align-items:baseline;justify-content:space-between;gap:10px;flex-wrap:wrap}
.sec h2{font-size:20px}
.sec small{color:var(--muted);font-size:13px}
.card{background:var(--card);border-radius:var(--r);padding:16px;border:1px solid var(--line);margin-bottom:10px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(max-width:520px){.grid2{grid-template-columns:1fr}}
.partcard{border-radius:var(--r);padding:16px;background:var(--card);border:1px solid var(--line);text-align:left;width:100%;display:block}
.partcard .tag{display:inline-block;font-size:12px;font-weight:700;color:#fff;border-radius:8px;padding:3px 8px;margin-bottom:8px}
.partcard h3{font-size:16px;margin-bottom:6px}
.bar{height:7px;background:var(--soft);border-radius:99px;overflow:hidden;margin-top:10px}
.bar i{display:block;height:100%;border-radius:99px;transition:width .4s}
.pmeta{font-size:12px;color:var(--muted);margin-top:6px}
.chips{display:flex;gap:6px;overflow-x:auto;padding:2px 0 8px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:8px 14px;border-radius:999px;background:var(--card);border:1px solid var(--line);font-weight:600;font-size:13px;color:var(--navy);white-space:nowrap}
.chip.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.pill{display:inline-block;font-size:11px;font-weight:700;padding:2px 8px;border-radius:7px;color:#fff;vertical-align:middle}
.lead{font-size:14.5px}
.en{background:#F3F5FB;border-left:0;border-radius:14px;padding:12px 14px;font-size:14px;color:#24305A;position:relative}
.en b.lbl{display:block;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:#6772A0;margin-bottom:4px}
.box-task{background:var(--soft);border-radius:14px;padding:12px 14px;font-size:13.5px;color:#4A4636}
.slide{background:var(--card);border:1px solid var(--line);border-radius:18px;margin-bottom:8px;overflow:hidden}
.slide summary{list-style:none;display:flex;align-items:center;gap:10px;padding:13px 14px;cursor:pointer}
.slide summary::-webkit-details-marker{display:none}
.num{flex:none;width:30px;height:30px;border-radius:10px;display:grid;place-items:center;font-weight:700;font-size:13px;color:#fff}
.slide .st{flex:1;font-weight:600;font-size:14px;color:var(--navy)}
.chk{flex:none;width:26px;height:26px;border-radius:8px;border:2px solid var(--line);display:grid;place-items:center;font-size:14px;color:transparent}
.chk.on{background:var(--ok);border-color:var(--ok);color:#fff}
.slide .body{padding:0 14px 14px}
.slide .body p{margin:0 0 10px}
.keys{margin:0 0 10px;padding:0;list-style:none}
.keys li{position:relative;padding:6px 0 6px 18px;border-bottom:1px dashed var(--line);font-size:14px}
.keys li:last-child{border-bottom:0}
.keys li:before{content:"";position:absolute;left:3px;top:13px;width:7px;height:7px;border-radius:50%;background:var(--dot,#1E2A4A)}
.trap{background:#FDF0EB;border-radius:14px;padding:10px 12px;font-size:13.5px;color:#7A3420;margin-top:10px}
.trap b{color:#B4492C}
.qcard{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px;margin-bottom:10px}
.qcard .q{font-weight:600;color:var(--navy);font-size:15px}
.qcard .hint{font-size:13px;color:var(--muted);margin-top:6px}
.qcard .ans{display:none;margin-top:10px}
.qcard.open .ans{display:block}
.qrow{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.mini{padding:8px 12px;border-radius:12px;font-weight:600;font-size:13px;background:var(--soft);color:var(--navy)}
.mini.ok{background:#E3F4F1;color:#1C6E64}
.mini.bad{background:#FDECE6;color:#A3412A}
.mini.sel.ok{background:var(--ok);color:#fff}
.mini.sel.bad{background:var(--bad);color:#fff}
.opt{display:block;width:100%;text-align:left;padding:13px 14px;border-radius:14px;border:1.5px solid var(--line);background:var(--card);margin-bottom:8px;font-weight:500}
.opt.right{border-color:var(--ok);background:#E3F4F1}
.opt.wrong{border-color:var(--bad);background:#FDECE6}
.expl{background:var(--soft);border-radius:14px;padding:10px 12px;font-size:13.5px;margin-top:4px}
.score{font-family:Fraunces,serif;font-size:44px;color:var(--navy);text-align:center;margin:10px 0 0}
.flip{perspective:1200px;height:300px;margin:6px 0 12px}
.flip .inner{position:relative;width:100%;height:100%;transition:transform .5s;transform-style:preserve-3d}
.flip.on .inner{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;border-radius:24px;padding:22px;display:flex;flex-direction:column;justify-content:center;text-align:center}
.face.front{background:var(--card);border:1px solid var(--line)}
.face.front h3{font-size:22px}
.face.back{background:var(--navy);color:#fff;transform:rotateY(180deg);font-size:15.5px;line-height:1.55}
.face small{position:absolute;top:14px;left:0;right:0;font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.face.back small{color:#9AA6C9}
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:rgba(246,241,231,.94);backdrop-filter:blur(10px);border-top:1px solid var(--line);padding:8px 8px calc(8px + env(safe-area-inset-bottom));z-index:20}
nav.tabs .in{max-width:760px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);gap:4px}
nav.tabs button{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 2px;border-radius:12px;font-size:11.5px;font-weight:600;color:var(--muted)}
nav.tabs button svg{width:22px;height:22px}
nav.tabs button.on{color:var(--navy);background:var(--card)}
.view{display:none}.view.on{display:block}
.tool{text-align:left;width:100%}
.tool .tn{font-weight:700;color:var(--navy);font-size:14.5px}
.tool .td{font-size:13px;color:var(--muted);margin-top:4px}
.modal{position:fixed;inset:0;background:rgba(20,26,45,.55);z-index:50;display:none;align-items:flex-end;justify-content:center}
.modal.on{display:flex}
.sheet{background:var(--bg);width:100%;max-width:760px;max-height:92vh;overflow:auto;border-radius:26px 26px 0 0;padding:18px 16px 30px}
.sheet .x{float:right;width:34px;height:34px;border-radius:12px;background:var(--card);border:1px solid var(--line);font-size:18px}
.sheet h2{font-size:22px;margin:4px 0 12px}
.matrix{position:relative;aspect-ratio:1.45/1;background:var(--card);border:1px solid var(--line);border-radius:18px;overflow:hidden;margin:6px 0}
.matrix .q{position:absolute;width:50%;height:50%;padding:8px 10px;font-size:11.5px;font-weight:700;letter-spacing:.03em;text-transform:uppercase}
.matrix .dot{position:absolute;transform:translate(-50%,-50%);border-radius:999px;color:#fff;font-weight:700;font-size:12px;padding:5px 9px;white-space:nowrap;box-shadow:0 2px 6px rgba(0,0,0,.12)}
.axis{font-size:11.5px;color:var(--muted);text-align:center;margin-top:2px}
table.t{width:100%;border-collapse:separate;border-spacing:0;font-size:13px;background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden}
table.t th{background:var(--navy);color:#fff;font-weight:600;padding:8px 6px;text-align:center}
table.t th:first-child,table.t td:first-child{text-align:left;padding-left:10px}
table.t td{padding:8px 6px;border-top:1px solid var(--line);text-align:center}
.tscroll{overflow-x:auto}
.y{color:var(--ok);font-weight:700}.n{color:var(--bad);font-weight:700}.m{color:var(--warn);font-weight:700}
.badge{display:inline-block;font-size:11px;font-weight:700;padding:2px 7px;border-radius:7px}
.numrow{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px dashed var(--line);font-size:14px}
.numrow:last-child{border-bottom:0}
.numrow .v{font-weight:700;color:var(--navy);text-align:right}
.numrow .v.hide{color:transparent;background:var(--soft);border-radius:8px;min-width:90px;cursor:pointer}
.weak .numrow{display:block}
.weak b{color:var(--navy)}
.thread{display:flex;flex-direction:column;gap:8px}
.thread .st{display:flex;gap:12px;align-items:flex-start;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px}
.thread .st .num{width:34px;height:34px}
.timer{font-family:Fraunces,serif;font-size:40px;color:var(--navy);text-align:center}
.tips li{margin-bottom:6px}
.legend{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:12px;color:var(--muted);margin-top:6px}
.legend span:before{content:"";display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:5px;background:var(--c)}
</style>
</head>
<body>
<div class="wrap">
  <div class="top"><div class="brand" data-t="brand">KEDGE · Corporate Strategy · Groupe 4</div><div class="right"><div class="lang"><button id="lgfr" onclick="setLang('fr')">FR</button><button id="lgen" onclick="setLang('en')">EN</button></div><div class="count" id="countdown"></div></div></div>

  <!-- ACCUEIL -->
  <section class="view on" id="v-home">
    <div class="hero">
      <h1 data-t="heroTitle"></h1>
      <p data-t="heroText"></p>
      <div class="actions">
        <button class="btn btn-light" onclick="startDraw()" data-t="draw"></button>
        <button class="btn btn-ghost" onclick="openThread()" data-t="thread"></button>
      </div>
    </div>
    <div class="sec"><h2 data-t="partsTitle"></h2><small data-t="partsSub"></small></div>
    <div class="grid2" id="homeParts"></div>
    <div class="sec"><h2 data-t="toolsTitle"></h2><small data-t="toolsSub"></small></div>
    <div class="grid2" id="toolsList"></div>
    <div class="sec"><h2 data-t="methodTitle"></h2></div>
    <div class="card">
      <ol class="tips" id="methodList" style="margin:0;padding-left:18px"></ol>
    </div>
    <div class="card" style="display:flex;gap:8px;flex-wrap:wrap;align-items:center;justify-content:space-between">
      <span style="font-size:13px;color:var(--muted)" data-t="saved"></span>
      <button class="mini" onclick="resetAll()" data-t="reset"></button>
    </div>
  </section>

  <!-- PARTIES -->
  <section class="view" id="v-parts">
    <div class="chips" id="partChips"></div>
    <div id="partBody"></div>
  </section>

  <!-- JURY -->
  <section class="view" id="v-jury">
    <div class="sec" style="margin-top:4px"><h2 data-t="juryTitle"></h2><small id="juryStat"></small></div>
    <div class="chips" id="juryChips"></div>
    <div class="chips" id="juryFilter"></div>
    <div id="juryList"></div>
  </section>

  <!-- QUIZ -->
  <section class="view" id="v-quiz">
    <div class="sec" style="margin-top:4px"><h2 data-t="quizTitle"></h2><small data-t="quizSub"></small></div>
    <div class="chips" id="quizChips"></div>
    <div id="quizBody"></div>
  </section>

  <!-- CARTES -->
  <section class="view" id="v-cards">
    <div class="sec" style="margin-top:4px"><h2 data-t="cardsTitle"></h2><small id="cardStat"></small></div>
    <div class="chips" id="cardChips"></div>
    <div id="cardBody"></div>
  </section>
</div>

<nav class="tabs"><div class="in">
  <button class="on" data-v="home" onclick="go('home')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg><span data-t="tabHome">Accueil</span></button>
  <button data-v="parts" onclick="go('parts')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="13" rx="2"/><path d="M8 21h8M12 17v4"/></svg><span data-t="tabSlides">Slides</span></button>
  <button data-v="jury" onclick="go('jury')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 21l1.9-5.4A8 8 0 1 1 21 12z"/></svg><span data-t="tabJury">Jury</span></button>
  <button data-v="quiz" onclick="go('quiz')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M9.5 9a2.5 2.5 0 1 1 3.5 2.3c-.7.3-1 .9-1 1.7M12 17h.01"/></svg><span data-t="tabQuiz">Quiz</span></button>
  <button data-v="cards" onclick="go('cards')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="6" width="14" height="14" rx="2"/><path d="M8 3h11a2 2 0 0 1 2 2v11"/></svg><span data-t="tabCards">Cartes</span></button>
</div></nav>

<div class="modal" id="modal" onclick="if(event.target===this)closeModal()"><div class="sheet" id="sheet"></div></div>

<script>
/* ============ DONNÉES DE RÉVISION ============ */
const PARTS = {
1: {
  name: `Part 1`, short: `Market & segmentation`, color: `#2A9D8F`,
  title: `Secteur français des jeux et jouets : segmentation, FCS et BCG 2`,
  task: `Analyser le MARCHÉ (pas une entreprise) : variables de segmentation, choix des plus pertinentes, segmentation stratégique et présentation des segments, FCS par segment (expliqués et reliés entre eux), positionnement de tous les segments dans la matrice BCG 2 (BCG 80).`,
  essentialFR: `Le marché pèse 4,7 Md€ en 2025 (+7,1 %, record depuis 2000), tiré par les kidultes (33 %) et les licences (30 %), alors que la natalité baisse. Nous le découpons en 6 DAS en croisant usage principal × profil utilisateur. Chaque DAS a ses propres FCS. La BCG 80 montre 1 DAS en volume (licences), 2 en spécialisation (éveil, collection), 2 fragmentés (traditionnels, jeux de société) et 1 en impasse (plein air). Message : pour une PME française, la spécialisation est plus réaliste que la course au volume.`,
  pitchEN: `In Part 1 we analysed the French games and toys market as a whole. It reached 4.7 billion euros in 2025, its best growth since 2000, driven by kidults and licences while the birth rate keeps falling. We built six strategic business units by combining the main use of the product with the user profile. Each unit has its own key success factors, and the BCG 2 matrix shows that only licensed toys follow a volume logic, so French SMEs should look for specialist positions rather than fight global leaders on scale.`,
  slides: [
    {n:1, t:`Cover`, what:`Page de garde officielle KEDGE : titre, noms, groupe 4, participation.`, keys:[], say:``, trap:``},
    {n:2, t:`A €4.7bn market driven by record growth`,
     what:`Photo du marché 2025 en 6 chiffres clés + une note de méthode qui explique pourquoi nous retenons Circana plutôt que Xerfi.`,
     keys:[`€4.7bn en 2025 : +7,1 % en valeur, +7 % en volume, meilleure croissance depuis 2000`,`€18 : prix moyen stable, la croissance vient des volumes`,`53 % des ventes au T4 (Noël)`,`33 % du CA fait par les 12 ans et + (kidultes), +16 %`,`30 % du CA sous licence, +19 % (Pokémon n°1, Lilo & Stitch n°2)`,`14 % : part de marché des fabricants français`],
     say:`The French games and toys market reached 4.7 billion euros in 2025, up 7.1 percent, the best growth since 2000. Prices stayed stable at around 18 euros, so growth came from volumes, mainly kidults and licences.`,
     trap:`"Pourquoi 4,7 Md€ alors que la consigne cite Xerfi (plus de 4 Md€) ?" → Xerfi estime environ 4,4 Md€ ; l'écart vient de périmètres et de méthodes différents. Circana est un panel distributeurs qui détaille catégories, cibles et circuits, donc plus utile pour segmenter.`},
    {n:3, t:`Six major challenges for the sector`,
     what:`Les 6 grands enjeux, classés en menace, opportunité ou mixte.`,
     keys:[`MENACE · Natalité : 645 000 naissances en 2025 (-2,1 %), fécondité 1,56 (plus bas depuis 1918) ; effet estimé -1,5 % de CA en 2024`,`OPPORTUNITÉ · Cible élargie : kidultes 33 % du CA, collection 13 %, la collection fait près de 70 % des gains du marché`,`MIXTE · Licences : 30 % du CA, les ayants droit captent de la valeur, dépendance au calendrier des sorties`,`MENACE · Saisonnalité : 53 % des ventes au T4`,`MENACE · Délocalisation et marketplaces : 86 % des jouets achetés à des vendeurs tiers hors UE sont dangereux (FFJP/TIE)`,`MIXTE · Régulation : règlement UE 2025/2509 (interdiction PFAS, passeport numérique, appli 2030) + REP jouets loi AGEC 2022 (seulement 3 % des jouets collectés)`],
     say:`The sector faces a paradox: fewer children are born, but adults have become a new growth driver. Around this, four forces shape the market: licence dependence, extreme seasonality, unsafe imports from marketplaces and stricter EU regulation.`,
     trap:`Le 86 % ne concerne PAS tous les jouets importés : seulement ceux achetés auprès de vendeurs tiers hors UE sur des marketplaces en ligne.`},
    {n:4, t:`Identifying the relevant segmentation variables`,
     what:`Nous testons 8 variables. Règle : un segment stratégique regroupe des offres avec les mêmes critères d'achat, les mêmes concurrents et les mêmes FCS. Nous retenons usage principal × profil utilisateur. Pour les produits limites, c'est la finalité d'achat dominante qui tranche.`,
     keys:[`RETENUE · Profil / âge de l'utilisateur (bébé, enfant, kidulte) : change l'acheteur, la sécurité, la finalité. L'âge seul ne suffit pas`,`RETENUE · Usage / fonction (éveil, personnages, créativité, plein air, règles, collection)`,`AFFINE · Modèle d'offre (licence, IP propre) : une licence peut apparaître dans tous les segments`,`PAS SEUL CRITÈRE · Matériau (une cuisine en bois = imitation, un hochet en bois = éveil)`,`DANS CHAQUE SEGMENT · Prix, circuit (on classe le produit, pas le magasin), origine`,`CONDITION OPÉRATIONNELLE · Saison`],
     say:`We kept two variables: the main use of the product and the user profile, because they change the buyer, the competitors and the key success factors. Price, channel and country of origin exist inside every segment, so they refine the analysis but cannot define a segment.`,
     trap:`"Pourquoi pas le circuit de distribution ?" → Les mêmes produits passent par tous les circuits ; on classe le produit, pas le distributeur. Le circuit sert dans la Part 2.`},
    {n:5, t:`Six SBUs based on product use × user profile`,
     what:`La matrice des 6 DAS avec les tranches d'âge indicatives, et surtout la RÈGLE D'ALLOCATION par ordre de priorité pour classer un produit ambigu.`,
     keys:[`Ordre : 1) éveil préscolaire dédié (DAS 1) → 2) mouvement plein air (DAS 4) → 3) construction modulaire ou collection (DAS 6) → 4) règles / puzzles (DAS 5) → 5) univers de personnages (DAS 2) → 6) imitation / créativité générique (DAS 3)`,`Barbie classique = DAS 2 ; Barbie collector = DAS 6 ; cuisine générique = DAS 3`,`Les licences et les âges se chevauchent entre segments`,`Les catégories Circana inspirent mais ne définissent pas les 6 DAS`],
     say:`When a product could fit two segments, we apply a priority order: dedicated preschool learning first, then outdoor movement, building or collecting, rule-based games and puzzles, character worlds, and finally generic imitation and creativity. For example, an ordinary Barbie is in SBU 2 but a collector Barbie is in SBU 6.`,
     trap:`Le jury peut te donner un produit à classer. Révise l'onglet Quiz : puzzle Disney = 5, porteur sous licence = 4, LEGO Star Wars = 6, hochet en bois = 1, cartes Pokémon = 6.`},
    {n:6, t:`Presentation of the six SBUs (1/2): SBU 1 to 3`,
     what:`Pour chaque DAS : périmètre, exemples, règle de frontière, logique concurrentielle et données remises en contexte.`,
     keys:[`DAS 1 · Éveil et préscolaire (0-6 ans) : Vulli, Fisher-Price, VTech, Tonies, Janod. Logique : confiance des parents, adéquation au développement, contenus audio et rachats. Exposé à la natalité`,`DAS 2 · Licences et personnages : Barbie, Hot Wheels, Playmobil, peluches sous licence. Logique : les univers attirent, le marketing et la présence en magasin convertissent`,`DAS 3 · Traditionnels et créatifs : cuisines Smoby / Ecoiffier, Vilac, Play-Doh, Clementoni. Logique : robustesse, matériaux, qualité. Smoby produit 75 % en France (exemple d'entreprise)`],
     say:`SBU 1 is driven by parents' trust, SBU 2 by attractive character worlds supported by marketing, and SBU 3 by robust design and quality. Material or French origin alone does not put a product in SBU 3.`,
     trap:`Ne dis jamais que les licences représentent 30 % du DAS 2 : c'est un chiffre tous marchés confondus, il ne mesure pas la taille du DAS 2.`},
    {n:7, t:`Presentation of the six SBUs (2/2): SBU 4 to 6`,
     what:`Même structure pour les 3 derniers DAS.`,
     keys:[`DAS 4 · Plein air et sport : toboggans et porteurs Smoby, Zuru X-Shot, Nerf (Hasbro). Logique : robustesse, coût livré, produits encombrants, météo`,`DAS 5 · Jeux de société et puzzles : Dobble, Ravensburger, Asmodee, Hachette Boardgames, Gigamic. 1,1 Md€ en 2025 (France = 1er marché européen)`,`DAS 6 · Collection et construction kidulte : cartes Pokémon, Pop Mart, LEGO, poupées collector. Collection +45 %, cartes stratégiques +78 %, construction +32 % (mesures séparées, à ne pas additionner)`],
     say:`SBU 4 competes on robustness and delivered cost, SBU 5 on game selection and distribution, and SBU 6 on desirable intellectual property and repeat purchases. Kidults are a key target of SBU 6, but not its only users.`,
     trap:`Cartes Pokémon = DAS 6 (système de collection), pas DAS 5. Un puzzle Disney reste en DAS 5 malgré la licence.`},
    {n:8, t:`Key success factors by SBU (1/2)`,
     what:`Définition : un FCS est une ressource ou une compétence indispensable pour réussir dans un DAS (Strategor, 2019). 4 FCS expliqués par DAS + un encadré "Links".`,
     keys:[`DAS 1 : sécurité et conformité parfaites · confiance et notoriété · valeur d'éveil prouvée · hausse de la valeur par enfant. LIEN : sécurité → confiance → prix premium qui compense la baisse des volumes`,`DAS 2 : accès aux licences fortes · puissance marketing · économies d'échelle et sourcing (prix moyen ≈18 €) · référencement à Noël. LIEN : une licence coûte cher, il faut du volume, donc du marketing et du référencement ; ce cercle favorise les leaders mondiaux`,`DAS 3 : qualité, durabilité, design · productivité industrielle · origine et éco-conception · export. LIEN : le Made in France n'a de valeur que si l'écart de prix reste acceptable, donc la productivité conditionne l'avantage d'origine`],
     say:`In SBU 1, safety builds trust and trust allows a premium price. In SBU 2, licences are expensive and need volume, which favours global leaders. In SBU 3, Made in France only works if productivity keeps the price gap acceptable.`,
     trap:`La consigne demande de NE PAS faire une simple liste : insiste toujours sur les liens entre FCS.`},
    {n:9, t:`Key success factors by SBU (2/2)`,
     what:`Les FCS des DAS 4 à 6 et leurs liens.`,
     keys:[`DAS 4 : compétitivité-prix · logistique · prévision et stocks (saison courte, météo) · robustesse et SAV (pièces Smoby). LIEN : le coût du transport réduit l'avantage des imports asiatiques sur les produits encombrants (analyse du groupe)`,`DAS 5 : capacité éditoriale (≈1 200 nouveautés/an) · puissance de distribution · gestion des best-sellers (Dobble, 6 qui prend !) · communauté. LIEN : trop d'offre rend la visibilité rare, la distribution devient le FCS central (rachats d'Asmodee et Hachette)`,`DAS 6 : contrôle de l'IP · gestion de la rareté · engagement communautaire · distribution dédiée premium (jusqu'à 168 € un coffret Pokémon). LIEN : IP → rareté → communauté → prix premium ; risque = essoufflement de la mode`],
     say:`In board games, there is too much supply, so distribution becomes the central success factor. In collectibles, intellectual property creates scarcity, scarcity drives the community, and the community accepts premium prices.`,
     trap:``},
    {n:10, t:`Links between KSFs: a cross-SBU view`,
     what:`Tableau d'intensité de 7 FCS transversaux dans les 6 DAS (●●● déterminant, ●● important, ● secondaire, évaluation du groupe) et 3 cercles qui relient les FCS.`,
     keys:[`Cercle licence-volume : licences + marketing créent du volume, le volume finance de nouvelles licences (DAS 2 et 6, favorise les plus gros)`,`Cercle sécurité-confiance : la conformité protège face aux marketplaces non conformes et justifie un prix plus élevé (DAS 1 et 3)`,`Lien innovation-saisonnalité : les nouveautés font 29 % du CA mais se vendent surtout à Noël, il faut une supply chain qui livre à temps`],
     say:`Across segments, we found three circles: the licence-volume circle, the safety-trust circle and the innovation-seasonality link. They explain why some segments favour large players and others favour trusted specialists.`,
     trap:`Les points du tableau sont une évaluation du groupe : assume-le ("this is our assessment based on the evidence").`},
    {n:11, t:`Positioning of the six SBUs in the BCG 2 matrix`,
     what:`Matrice des systèmes concurrentiels : axe X = taille de l'avantage concurrentiel, axe Y = nombre de sources de différenciation. Bulles de même taille. Flèches = évolution probable.`,
     keys:[`Volume : DAS 2 (licences)`,`Spécialisation : DAS 1 (éveil) et DAS 6 (collection)`,`Fragmentation : DAS 3 (traditionnels) et DAS 5 (jeux de société)`,`Impasse : DAS 4 (plein air)`,`Lecture : les DAS 2 et 6 sont tenus par ceux qui ont la taille ou l'IP ; les PME françaises ont plus de chances en DAS 1 et 3 avec un vrai avantage de spécialiste`],
     say:`Only licensed toys follow a volume logic. Early-age and collectibles are specialisation segments, traditional toys and board games are fragmented, and outdoor toys are in a stalemate where only price matters.`,
     trap:`La BCG 80 décrit la logique concurrentielle d'un DAS, pas la position d'une entreprise. Ne la confonds pas avec la BCG 1 (croissance / part de marché).`},
    {n:12, t:`Why we placed each SBU in this position`,
     what:`Tableau de justification : système, sources de différenciation, taille de l'avantage, évolution probable.`,
     keys:[`DAS 1 Spécialisation : nombreuses sources (sécurité, pédagogie, design, contenus) ; avantage fort (confiance marque) ; risque de glisser vers l'impasse pour les produits basiques (natalité)`,`DAS 2 Volume : peu de sources (la licence s'achète, produits similaires) ; avantage fort par l'échelle (sourcing, médias, référencement)`,`DAS 3 Fragmentation : nombreuses sources (matériau, design, origine) ; avantage faible (beaucoup de PME) ; Smoby / Ecoiffier peuvent viser la spécialisation`,`DAS 4 Impasse : peu de sources (prix, robustesse) ; avantage faible (imports, généralistes, météo) ; sortie par l'innovation ou la production proche`,`DAS 5 Fragmentation : très nombreuses sources (thèmes, mécaniques, auteurs) ; avantage faible (180 éditeurs, barrières basses) ; évolue vers la spécialisation avec la concentration de la distribution`,`DAS 6 Spécialisation : IP, rareté, communauté ; avantage fort (une franchise est unique) ; risque d'essoufflement`],
     say:`Board games are fragmented today because there are many ways to differentiate but low entry barriers, with more than 180 publishers. As distribution concentrates around Asmodee and Hachette, the segment is moving towards specialisation.`,
     trap:`"Asmodee est énorme, pourquoi fragmenté ?" → la taille d'Asmodee vient surtout de la distribution ; côté édition, 180+ éditeurs et environ 1 200 nouveautés par an, donc avantage faible pour l'instant, d'où la flèche vers la spécialisation.`},
    {n:13, t:`Conclusion: strategic implications for the sector`,
     what:`Synthèse en 3 blocs : un marché qui change, six cadres concurrentiels, implications pour les entreprises.`,
     keys:[`Marché à 4,7 Md€, kidultes 33 %, licences 30 % ; natalité, saisonnalité et régulation restent des défis`,`Chaque segment a ses critères d'achat, sa structure de coûts et ses FCS : une seule stratégie ne peut pas tout couvrir`,`Trois façons de concurrencer : échelle et coûts, différenciation de spécialiste, niches créatives`,`Conclusion : la compétitivité durable vient de la combinaison des bons FCS dans un segment clairement défini`],
     say:`Our overall conclusion is that sustainable competitiveness comes from combining the right key success factors within a clearly defined segment, while managing demand and operational risks.`,
     trap:``},
    {n:14, t:`References`, what:`Abell (1980) pour la segmentation, BCG (1980) pour la matrice, Strategor (2019), Circana/FFJP/FCJPE (2026), Insee (2026), Xerfi, règlement UE 2025/2509, presse (LSA, Gus&Co, Mayer Brown...).`, keys:[], say:``, trap:``}
  ],
  weak: [
    [`Écart Xerfi / Circana`, `Périmètres différents. Circana = panel distributeurs, détail par catégorie, cible, circuit. On l'a signalé dans une note de méthode.`],
    [`Les ● du tableau des FCS et la position des bulles`, `Ce sont des évaluations du groupe, appuyées sur les données citées. On l'assume et on justifie avec le tableau de la slide 12.`],
    [`Les chiffres de croissance du DAS 6 (+45 %, +78 %, +32 %)`, `Ce sont des mesures séparées de Circana, on ne les additionne pas et elles ne mesurent pas la croissance du DAS 6 dans son ensemble.`],
    [`Kidulte, un segment ?`, `Non : c'est un profil qui traverse plusieurs DAS (dominant en 6, important en 5).`]
  ],

2: {
  name: `Part 2`, short: `Competition & distributors`, color: `#E76F51`,
  title: `La concurrence entre distributeurs : 5 forces, concurrents, groupes stratégiques`,
  task: `Focus sur les DISTRIBUTEURS (La Grande Récré, King Jouet, Smyths...) : 5 forces de Porter, identification et analyse des principaux concurrents, carte des groupes stratégiques avec variables justifiées, et description du business model de chaque groupe.`,
  essentialFR: `L'industrie étudiée = distribution de jeux et jouets neufs en France. Les 5 forces donnent un secteur dur : rivalité, fournisseurs et nouveaux entrants forts, clients et substituts moyens (marge nette de King Jouet ≈ 1,4 %). Trois acteurs font ≈41 % du marché : groupe JouéClub 15,6 %, King Jouet 13,7 %, Leclerc ≈12 %, avec Smyths en challenger. Nous identifions 7 groupes stratégiques sur 2 cartes (spécialisation × proposition de valeur ; canal × profondeur d'assortiment) et décrivons leur business model.`,
  pitchEN: `In Part 2 we focused on toy retailers in France. Porter's five forces show a tough industry: rivalry, supplier power and the threat of new entrants are high, which keeps margins thin. Three players hold about 41 percent of the market: the JouéClub group, King Jouet and E.Leclerc, with Smyths as the fast-growing challenger. We then built two strategic group maps and identified seven groups, from toy specialist networks to online platforms, each with a different business model.`,
  slides: [
    {n:1, t:`Cover`, what:`Page de garde.`, keys:[], say:``, trap:``},
    {n:2, t:`The arena: who sells games and toys in France?`,
     what:`Cadrage : qui vend des jouets neufs en France. Graphique de croissance par circuit + 3 chiffres clés. La seconde main est traitée comme substitut.`,
     keys:[`Croissance 2025 : spécialistes et multi-spécialistes +11 %, en ligne +8 %, GSA (hyper/super) -1 %`,`42 % des ventes par les spécialistes et multi-spécialistes (1er circuit) ; environ 45 % en septembre 2026`,`2/3 des jouets achetés en magasin : la France a la part online la plus faible d'Europe`,`Marché 4,7 Md€ en 2025, +8,5 % en valeur de janvier à juillet 2026`],
     say:`Toy specialists are the leading channel with 42 percent of sales, and they grew faster than the market in 2025, while hypermarkets lost sales. Two thirds of toys are still bought in physical stores in France.`,
     trap:`Pourquoi la seconde main n'est pas un distributeur ? → On analyse la vente de jouets NEUFS ; l'occasion répond au même besoin par un autre produit, donc c'est un substitut.`},
    {n:3, t:`Porter's five forces: a tough industry for toy retailers`,
     what:`Le schéma de synthèse avec l'intensité de chaque force + la définition de l'industrie + les complémenteurs (6e force).`,
     keys:[`Rivalité : FORTE (●●●●)`,`Nouveaux entrants : FORTE (●●●●)`,`Pouvoir des fournisseurs : FORT (●●●●)`,`Pouvoir des clients : MOYEN (●●●)`,`Substituts : MOYEN (●●●)`,`Complémenteurs (Brandenburger & Nalebuff, 1996) : licenciés, sorties de films, réseaux sociaux créent la demande pour tous`,`So what : seuls ceux qui ont la taille, une forte proposition de valeur ou des produits exclusifs gagnent plus qu'une marge fine (King Jouet ≈1,4 % net en 2025)`],
     say:`Three forces are high: rivalry, supplier power and new entrants. Buyer power and substitutes are medium. The result is strong pressure on margins: King Jouet's net margin was only about 1.4 percent in 2025.`,
     trap:`Les scores sont une évaluation du groupe fondée sur les preuves des slides suivantes. L'industrie : manufacturiers = fournisseurs, consommateurs = clients (Porter, 2008).`},
    {n:4, t:`Force 1: rivalry among distributors is high`,
     what:`5 facteurs qui poussent les distributeurs dans une bataille de prix et de réseau + 3 chiffres.`,
     keys:[`1. Cœur concentré, queue fragmentée : JouéClub 15,6 % + King Jouet 13,7 % + Leclerc ≈12 % ≈ 41 %`,`2. Produits de marque identiques (LEGO, Pokémon, Barbie) donc comparaison de prix`,`3. Saisonnalité extrême : 53 % au T4, stocks engagés des mois avant`,`4. Plus de capacité, moins d'enfants : ≈50 magasins spécialistes ouverts en 2025, Smyths 8 ouvertures en 2025 ; naissances -2,1 %`,`5. Faillites récentes : Toys"R"Us France → PicWicToys (2019) → Smyths (2022) ; maison mère de La Grande Récré liquidée en 2023, reprise par JouéClub pour 50 M€`,`Chiffre : marge nette King Jouet SA 1,4 % (5,4 M€ / 377 M€)`],
     say:`Rivalry is high because all retailers sell the same branded products, 53 percent of sales happen in the fourth quarter, and capacity keeps growing while the number of children falls. Recent failures like Toys R Us France and La Grande Récré show the pressure.`,
     trap:`Les parts de marché viennent de périodes différentes (2025-2026) : elles sont indicatives.`},
    {n:5, t:`Force 2: the threat of new entrants is high`,
     what:`Frise des entrées (rouge) et des mesures qui relèvent les barrières (vert), puis barrières vs raisons pour lesquelles la menace reste forte.`,
     keys:[`Frise : 2019 fusion PicWicToys · 2022 Smyths rachète PicWicToys · 2023 1re boutique Pop Mart en Europe (Paris) · 2025 Temu 19 % du discount en France · mars 2026 taxe française 2 €/article · juillet 2026 droit de douane UE 3 € sur les colis < 150 €`,`Barrières : logistique (entrepôts 43 000 m² Smyths, 42 000 m² King Jouet), BFR (stocks avant Noël), accès fournisseurs (allocations Pokémon, LEGO), réseau et marque (380 points de vente King Jouet, ≈420 magasins JouéClub)`,`Menace forte : entrée par acquisition (Smyths → 55 magasins), les marques deviennent distributeurs (23 LEGO Stores, Pop Mart vend Labubu seulement chez lui), plateformes sans magasins (≈1 Français sur 3 a acheté un jouet sur Temu, AliExpress ou Shein au S1 2025)`,`Contre-tendance : droit UE de 3 € et règlement sécurité des jouets`],
     say:`Barriers exist, mainly logistics, working capital and supplier access, but recent entries show they can be bypassed: Smyths entered by acquisition, brands like LEGO and Pop Mart sell directly, and platforms like Temu need no stores at all.`,
     trap:`La taxe française de 2 € (mars 2026) a été suspendue le 1er juillet 2026 et remplacée par le droit de douane UE de 3 €.`},
    {n:6, t:`Forces 3 and 4: powerful suppliers, demanding buyers`,
     what:`Fournisseurs (FORT) et clients (MOYEN), avec contrepoids.`,
     keys:[`Fournisseurs : LEGO 1er fabricant en France (+4 pts de PDM depuis 2019 ; 17-20 % selon des sources secondaires)`,`Licences 30 % du CA en 2025, 34 % en janvier 2026 : impossibles à retirer du rayon`,`Intégration aval : LEGO (23 boutiques) et Pop Mart vendent en direct`,`Rareté : Asmodee distribue les cartes Pokémon en France, les allocations décident qui vend les hits`,`Contrepoids : 99 % des fabricants de jouets de l'UE sont des PME ; centrales d'achat (JouéClub, Galec de Leclerc) ; JouéClub vise 50 % d'offre sourcée en Europe d'ici 2027`,`Clients : fragmentés MAIS coûts de changement nuls, comparaison facile, prix moyen 18 €, 54 % des 18-34 ans ont acheté sur des plateformes chinoises en 2025`,`Atténuation : kidultes fidèles aux franchises et moins sensibles au prix ; parents valorisent conseil et sécurité`],
     say:`Suppliers are powerful because must-have brands like LEGO and licences like Pokémon are concentrated, and some sell directly to consumers. Buyers are fragmented, so their power is only medium, but switching costs are zero and price comparison is easy.`,
     trap:`Le 17-20 % de LEGO vient de sources secondaires (blogs) : dis "secondary sources estimate", la source fiable (LSA) dit seulement +4 points depuis 2019.`},
    {n:7, t:`Force 5: substitutes are a medium but rising threat`,
     what:`Graphique de la seconde main + 3 types de substituts.`,
     keys:[`Seconde main : 169 M€ (2021) → 378 M€ (2025), 7,3 % du marché, +14 % en 2025 (neuf +8 %)`,`Vinted 25 %, Leboncoin 24 % ; occasion = 14,6 % des achats en ligne mais 3,8 % en magasin ; King'Okaz dans 30 magasins King Jouet`,`Jeu vidéo : 5,86 Md€ en 2025 (+2,9 %), plus gros que le jouet, 40,2 M de joueurs`,`Autres cadeaux et expériences (livres, vêtements, cartes cadeaux) : analyse du groupe`],
     say:`The second-hand market more than doubled in four years to 378 million euros and now grows faster than new toys. Video games, worth 5.86 billion euros, also compete for children's time and gift budgets.`,
     trap:``},
    {n:8, t:`The main competitors and their weight in the market`,
     what:`Graphique des 3 leaders + tableau des autres concurrents par type.`,
     keys:[`Groupe JouéClub (JouéClub + La Grande Récré) 15,6 % · King Jouet 13,7 % · E.Leclerc 12 % ⇒ ≈41 %`,`JouéClub = 42 % du circuit spécialiste`,`Smyths : 55 magasins en France, 2,53 Md€ de CA groupe (2024)`,`Carrefour, Auchan, U, Intermarché : GSA en recul (-1 %)`,`Fnac, Cultura : offre cartes et jeux toute l'année`,`Amazon (1er vendeur online), Cdiscount ; Temu, Shein, AliExpress`,`Action, Gifi, B&M (Action +20 % début 2025, Joko) ; LEGO Stores, Pop Mart`],
     say:`The top three retailers, the JouéClub group, King Jouet and E.Leclerc, hold about 41 percent of the market. Around them, Smyths, online platforms, cultural stores, discounters and brand stores fight for the rest.`,
     trap:`Périodes différentes : JouéClub 2026, King Jouet janvier-septembre 2025, Leclerc 2026.`},
    {n:9, t:`Competitor profiles: the two French specialist leaders`,
     what:`Fiches JouéClub et King Jouet : chiffres, business model, stratégie récente, forces / faiblesses.`,
     keys:[`JouéClub : coopérative de commerçants indépendants (Bordeaux). ≈220 adhérents, ≈300 magasins ; la coop achète, fait le marketing et approvisionne`,`Rachat de La Grande Récré en 2023 (50 M€) : 114 magasins dont 61 intégrés, transférés aux adhérents (moitié fin 2026). JouéClub en périphérie, LGR en centre-ville`,`Faiblesse : LGR pas encore rentable début 2025, intégration longue`,`King Jouet : groupe familial depuis 1875 (Voiron). 458 M€ de CA groupe 2025, 13,7 % de PDM, 380 points de vente (330 en France)`,`Succursales + franchise, omnicanal (online +9 % en 2024), entrepôt de 42 000 m² à Rives`,`KingDultes : 6 magasins + kingdultes.com ; adultes 21 % des ventes magasin en 2025, 32 % au T1 2026 ; King'Okaz dans 30 magasins`,`Faiblesse : marge nette fine (≈1,4 %)`],
     say:`JouéClub is a cooperative of about 220 independent retailers, now owning La Grande Récré. King Jouet is a family group founded in 1875, with 380 points of sale, a strong omnichannel model and a clear move towards adult collectors with KingDultes.`,
     trap:`Le 458 M€ = groupe King Jouet ; le 377 M€ = société King Jouet SAS seule (utilisé en Part 3).`},
    {n:10, t:`Competitor profiles: the challenger and the hypermarket leader`,
     what:`Fiches Smyths Toys et E.Leclerc.`,
     keys:[`Smyths : chaîne irlandaise, arrivée en 2022 en rachetant PicWicToys (ex Toys"R"Us et Picwic, 49 magasins). 55 magasins en France, 1 150 salariés, 2,53 Md€ de CA groupe`,`Grandes surfaces en retail parks, rayons du sol au plafond, prix bas, déco minimale ; entrepôt de 43 000 m² + un 2e en Isère (2026) ; 8 ouvertures en 2025, dont un ex-JouéClub à Brest ; Smyths Bébé`,`Leclerc : ≈12 % du marché du jouet ; catalogue de Noël de 128 pages (mi-octobre à début décembre) ; achats via le Galec ; ≈30 magasins spécialisés jouets (15 000 références à Brest)`,`Faiblesse Leclerc : peu de conseil, saison courte ; les hypers perdent du non-alimentaire (Auchan réduit 71 de ses 119 hypers)`],
     say:`Smyths is the challenger: big-box stores with a huge range at low prices and strong central logistics. E.Leclerc uses toys as a seasonal traffic builder in its hypermarkets and also runs about 30 specialised toy stores.`,
     trap:``},
    {n:11, t:`Other competitors that reshape the market`,
     what:`4 familles d'autres concurrents.`,
     keys:[`Plateformes : Amazon 1er vendeur online ; Temu de 8 % à 19 % du discount français en 2 ans ; 86 % des jouets de vendeurs tiers hors UE non conformes`,`Multi-spécialistes culturels : Fnac, Cultura, Micromania, toute l'année ; +44 % en septembre 2026 (Pokémon)`,`Magasins de marque : 23 LEGO Stores ; Pop Mart vend Labubu uniquement dans ses boutiques (Paris, Lyon, Bordeaux, Lille, Marseille, Toulouse fin octobre 2026), flagship prévu boulevard Haussmann`,`GSA et discounters : les hypers réduisent le non-alimentaire, Action croît (+20 % début 2025)`],
     say:`Beyond the three leaders, four families reshape the market: online platforms, cultural multi-specialists, brand-owned stores like LEGO and Pop Mart, and non-food discounters.`,
     trap:``},
    {n:12, t:`Choosing the variables for the strategic group map`,
     what:`Définition d'un groupe stratégique (Hunt, 1972 ; Porter, 1980) et critères d'un bon axe : séparer les business models, axes peu corrélés, refléter les barrières à la mobilité (Caves & Porter, 1977 ; McGee & Thomas, 1986). 7 variables testées, 4 retenues.`,
     keys:[`RETENUE carte 1 (X) : degré de spécialisation jouet`,`RETENUE carte 1 (Y) : proposition de valeur (prix libre-service ↔ service et expérience)`,`RETENUE carte 2 (X) : modèle de canal (magasin ↔ digital)`,`RETENUE carte 2 (Y) : profondeur d'assortiment jouet`,`NON : gouvernance (King Jouet et JouéClub se ressemblent pour le client)`,`NON : taille / localisation du magasin (corrélée à la proposition de valeur et au canal)`,`NON : cible (tout le monde vise les kidultes)`],
     say:`A good axis must separate business models, be weakly correlated with the other axis and reflect mobility barriers. We kept four variables on two maps. We rejected governance because King Jouet and JouéClub look the same to customers, even if one is integrated and the other a cooperative.`,
     trap:`"Pourquoi 2 cartes ?" → Pour vérifier que les groupes restent distincts sur deux couples de variables, ce qui confirme qu'ils reflètent de vrais business models.`},
    {n:13, t:`Strategic group map 1: specialisation × value proposition`,
     what:`7 groupes positionnés (position = évaluation du groupe ; boîtes non proportionnelles au CA). Flèches = mouvements de mobilité.`,
     keys:[`À droite (experts jouet) : 1 Réseaux spécialistes (King Jouet, JouéClub, LGR) en haut, conseil et animations ; 2 Grandes surfaces jouet (Smyths) en bas, prix et largeur ; 3 Magasins de marque (LEGO, Pop Mart, Disney) tout en haut`,`À gauche (généralistes) : 5 GSA (traffic builder), 6 Discounters (achat d'impulsion), 7 Plateformes (une catégorie parmi des millions)`,`Au milieu haut : 4 Multi-spécialistes culturels (Fnac, Cultura, Micromania)`,`Mobilité : King Jouet ouvre KingDultes pour aller vers le groupe 3 ; Leclerc ouvre des magasins jouets pour aller vers le groupe 1`],
     say:`On the right, toy experts: groups 1 and 2 target the same families but with opposite value propositions, advice and events for the specialist networks, price and range width for Smyths. On the left, generalists use toys as a traffic builder or impulse purchase.`,

3: {
  name: `Part 3`, short: `DuPont performance`, color: `#4F4898`,
  title: `Performance financière de King Jouet vs Smyths et La Grande Récré (DuPont)`,
  task: `Trouver les données financières de King Jouet et de 2 concurrents (choix justifié), calculer les ratios DuPont pour les 3, puis analyser et commenter la comparaison.`,
  essentialFR: `ROE = marge nette × rotation de l'actif × multiplicateur de capitaux propres. Sur 2024 (seule année commune), King Jouet et Smyths ont le même ROE (8,6 % vs 8,1 %) mais pas pour les mêmes raisons : Smyths gagne par l'efficacité (ROA 4,9 %, rotation 2,93), King Jouet par le levier (ROA 1,3 %, multiplicateur 6,4) grâce au crédit fournisseurs. La Grande Récré perd de l'argent et a des capitaux propres négatifs, donc son ROE n'a pas de sens. King Jouet se redresse en 2025 (ROE 11,8 %) par l'opérationnel.`,
  pitchEN: `In Part 3 we used the DuPont model to compare King Jouet with Smyths and La Grande Récré, its two closest integrated specialist rivals. In 2024, King Jouet and Smyths had almost the same return on equity, but Smyths earned it from efficiency while King Jouet relied on leverage, mainly supplier credit. La Grande Récré is loss-making with negative equity, so its ROE is not meaningful. King Jouet recovered in 2025 thanks to better margins and asset turnover.`,
  slides: [
    {n:1, t:`Cover`, what:`Page de garde Part 3.`, keys:[], say:``, trap:``},
    {n:2, t:`The DuPont model: three levers of return on equity`,
     what:`Arbre DuPont + 3 leviers + notre méthode.`,
     keys:[`ROE = Résultat net / Capitaux propres = ROA × Multiplicateur`,`ROA = Résultat net / Total actif = Marge nette × Rotation de l'actif`,`Marge nette = RN / CA (rentabilité : prix, achats, coûts magasins)`,`Rotation = CA / Total actif (efficacité : productivité des magasins, rotation des stocks, logistique)`,`Multiplicateur = Total actif / Capitaux propres (levier : dette ET fournisseurs ; augmente le ROE mais aussi le risque)`,`Méthode : comptes sociaux (normes françaises) des sociétés opérationnelles françaises, données publiques (Pappers, Infonet, Verif) ; 2024 = dernière année commune ; soldes de fin d'année ; nos ROE recoupent ceux publiés par Pappers et Infonet`],
     say:`The DuPont model breaks return on equity into three levers: profitability, measured by the net margin, efficiency, measured by asset turnover, and leverage, measured by the equity multiplier. It shows how a company earns its return, not only how much.`,
     trap:`Le multiplicateur ne mesure pas seulement la dette bancaire : tout le passif non financé par les actionnaires, donc aussi les dettes fournisseurs.`},
    {n:3, t:`Choice of competitors: two direct rivals with comparable accounts`,
     what:`Pourquoi Smyths Toys FR et Recreaclub (La Grande Récré), et pourquoi pas les autres.`,
     keys:[`Smyths Toys FR : groupe stratégique 2 (challenger), big boxes intégrées en retail parks, 283 M€ de CA 2024, 55 magasins, le spécialiste qui ouvre le plus ; comptes publiés 2022-2024`,`Recreaclub (La Grande Récré) : groupe 1 comme King Jouet, magasins intégrés (61 sur 114) en centre-ville et centres commerciaux ; 166 M€ (2024), 153 M€ (2025) ; bras intégré du groupe JouéClub (leader 15,6 %) ; a même vendu un magasin à King Jouet en 2025 ; comptes 2023 (8 mois) à 2025`,`Pourquoi pas JouéClub (EPSE) ? Centrale coopérative qui vend aux magasins adhérents : son CA et ses actifs sont de gros, pas de détail`,`Pourquoi pas Leclerc, Fnac, Amazon ? Le jouet n'est pas isolé dans leurs comptes`],
     say:`We chose Smyths because it is King Jouet's fastest-growing challenger, and La Grande Récré because it belongs to the same strategic group and is the integrated arm of the market leader. Both are toy specialists with integrated stores and published French accounts, so the comparison is fair.`,
     trap:`"Pourquoi pas JouéClub, le leader ?" → son entité EPSE est une centrale d'achat coopérative : ses ratios décriraient un grossiste, pas un distributeur. On prend donc sa filiale intégrée Recreaclub.`},
    {n:4, t:`Financial data used (statutory accounts, €m)`,
     what:`Tableau des données brutes (CA, résultat net, total actif, capitaux propres) + notes de lecture + alerte sur les capitaux propres négatifs de LGR.`,
     keys:[`King Jouet SAS : 2023 239,0 / 6,27 / 222,1 / 52,0 · 2024 351,3 / 3,46 / 257,3 / 40,2 · 2025 377,5 / 5,37 / 242,9 / 45,6`,`Smyths Toys FR : 2023 274,2 / 3,42 / 89,5 / 53,5 · 2024 283,0 / 4,70 / 96,6 / 58,2`,`Recreaclub : 2024 166,1 / -3,88 / 88,7 / -2,6 · 2025 152,7 / -5,49 / 84,0 / -8,1`,`King Jouet SAS = société française, pas le groupe (458 M€ en 2025)`,`Saut de CA de +47 % en 2024 = fusion-absorption de New MT (ex magasins Maxi Toys) en juin 2024`,`Exercice 2023 de Recreaclub (8 mois) exclu`],
     say:`We used statutory accounts of the French operating companies. Two points matter: King Jouet's 47 percent sales jump in 2024 comes from the merger of the former Maxi Toys stores, and La Grande Récré's equity is negative, so its leverage ratio and ROE cannot be interpreted.`,
     trap:`Les data providers affichent un ROE de +149 % pour LGR : c'est une perte divisée par des capitaux propres négatifs, résultat trompeur.`},
    {n:5, t:`DuPont results, FY2024: same ROE, very different routes`,
     what:`Le tableau central des ratios 2024 + graphique ROA vs ROE + message clé.`,
     keys:[`Marge nette : KJ 0,98 % · Smyths 1,66 % · LGR -2,33 %`,`Rotation de l'actif : KJ 1,37 · Smyths 2,93 · LGR 1,87`,`ROA : KJ 1,34 % · Smyths 4,87 % · LGR -4,38 %`,`Multiplicateur : KJ 6,40 · Smyths 1,66 · LGR non significatif`,`ROE : KJ 8,6 % · Smyths 8,1 % · LGR non significatif`,`L'écart entre la barre ROA et la barre ROE = l'effet de levier (grand pour KJ, petit pour Smyths)`],
     say:`In 2024, King Jouet and Smyths gave shareholders almost the same return, 8.6 versus 8.1 percent. But Smyths earned it from operations, with a return on assets of 4.9 percent, while King Jouet earned it from leverage, with a return on assets of only 1.3 percent.`,
     trap:`Apprends ce tableau par cœur : c'est LA slide de la Part 3.`},
    {n:6, t:`The three levers compared, FY2024`,
     what:`3 graphiques, un par levier, et leur lecture.`,
     keys:[`Rentabilité : Smyths garde 1,7 centime par € de CA, King Jouet 1,0 centime, LGR perd 2,3 centimes`,`Efficacité : Smyths génère 2,93 € de CA par € d'actif, plus du double de King Jouet (1,37) ; LGR a une rotation correcte (1,87) mais ses ventes ne couvrent pas ses coûts`,`Levier : l'actif de King Jouet = 6,4 fois ses capitaux propres ; Smyths 1,7 fois ; LGR illisible (capitaux propres négatifs)`],
     say:`Smyths is better on margin and much better on efficiency: it generates 2.93 euros of sales per euro of assets, more than twice King Jouet. King Jouet compensates with leverage: its assets are 6.4 times its equity.`,
     trap:``},
    {n:7, t:`King Jouet vs Smyths: leverage versus efficiency`,
     what:`Comparaison approfondie des deux modèles + "So what".`,
     keys:[`KJ : ROE 8,6 % (2024) et 11,8 % (2025) mais ROA seulement 1,3 % et 2,2 %`,`KJ : 257 M€ d'actif pour 40 M€ de capitaux propres en 2024 ; passif surtout d'exploitation : BFR d'exploitation -60,9 M€ (2024) et -37,6 M€ (2025), donc les fournisseurs financent le stock`,`KJ : dette financière modérée (≈27-31 M€), 50 M€ de trésorerie en 2025 ; actif plus lourd (réseau intégré, stocks, ex Maxi Toys)`,`Smyths : ROE 8,1 % quasiment sans levier (1,66) ; rotation 2,93 (big boxes, logistique centralisée 43 000 m²) ; marge 1,66 % (1,25 % en 2023)`,`Attention : Smyths Toys FR est une filiale d'un groupe irlandais, une partie des achats / logistique peut être dans d'autres sociétés du groupe`,`So what : même rendement actionnaire mais structure plus fragile pour KJ (ROA ≈ 1/4 de Smyths). Si les ventes ralentissent ou si les fournisseurs raccourcissent leurs délais, le ROE chute`],
     say:`King Jouet's leverage is not mainly bank debt: its operating working capital requirement is negative, so suppliers finance the stock, and it holds 50 million euros of cash. This is efficient while sales grow, but it makes the return fragile if sales slow down or suppliers shorten payment terms.`,
     trap:`"Le levier de King Jouet est-il dangereux ?" → Réponse nuancée : pas de surendettement bancaire (dette ≈27-31 M€, 50 M€ de cash), mais dépendance au crédit fournisseurs.`},
    {n:8, t:`King Jouet vs La Grande Récré: a turnaround still in progress`,
     what:`Graphique ROA 2024-2025 + 4 encadrés.`,
     keys:[`ROA : KJ 1,3 % → 2,2 % ; LGR -4,4 % → -6,5 %, l'écart se creuse`,`LGR : pertes -3,9 M€ (2024), -5,5 M€ (2025) ; capitaux propres -8,1 M€ ; en avril 2025 les actionnaires décident de ne pas dissoudre malgré la perte de plus de la moitié du capital`,`LGR : CA -8 % en 2025 (153 M€) car les magasins intégrés sont transférés aux adhérents JouéClub (ils sortent des comptes de Recreaclub)`,`ROE affiché +149 % (2024) et +68 % (2025) = trompeur`,`Pour KJ : rentable là où son rival direct perd ; la restructuration de LGR crée des opportunités (KJ a déjà racheté un magasin Recreaclub en 2025)`],
     say:`The gap with La Grande Récré is widening: King Jouet's return on assets improved from 1.3 to 2.2 percent, while La Grande Récré fell from minus 4.4 to minus 6.5 percent. Its restructuring even creates opportunities for King Jouet.`,
     trap:`La baisse du CA de Recreaclub ne veut pas dire que l'enseigne LGR vend moins : les magasins transférés aux adhérents sortent simplement de la société Recreaclub.`},
    {n:9, t:`King Jouet over time: a dip in 2024, a recovery in 2025`,
     what:`Évolution 2023-2025 des ratios de King Jouet.`,
     keys:[`ROE : 12,0 % (2023) → 8,6 % (2024) → 11,8 % (2025)`,`Marge nette : 2,62 % → 0,98 % → 1,42 %`,`Rotation : 1,08 → 1,37 → 1,55 ; multiplicateur : 4,27 → 6,40 → 5,33`,`2023→2024 : marge écrasée après la fusion New MT (ex Maxi Toys) dans un marché en baisse (-0,7 %) ; capitaux propres -12 M€ (non expliqué par les données publiques) donc multiplicateur à 6,4`,`2024→2025 : redressement sain, tous les leviers opérationnels s'améliorent (marge +0,4 pt, rotation 1,55 avec CA +7,5 % et actif -5,6 %) et le levier baisse : la reprise vient de l'opérationnel, pas de plus de dette`],
     say:`King Jouet's ROE dipped in 2024 after the merger of the former Maxi Toys stores in a falling market, then recovered to 11.8 percent in 2025. The recovery is healthy because it comes from better margin and asset turnover, while leverage actually decreased.`,
     trap:`"Pourquoi les capitaux propres baissent de 12 M€ en 2024 ?" → Honnêtement : les données publiques ne l'expliquent pas (on l'a écrit). Hypothèses possibles à présenter comme telles : distribution ou opérations liées à la fusion et au changement d'actionnariat.`},
    {n:10, t:`Conclusions for King Jouet`,
     what:`4 conclusions + limites de l'analyse.`,
     keys:[`Rentabilité = levier faible (1,0-1,4 %) : conditions d'achat, gammes exclusives et kidultes à plus forte marge, coûts magasins`,`Efficacité en progrès mais en retard : rotation 1,55 ≈ la moitié de Smyths ; revoir les magasins faibles (King Jouet Belgique de retour à un petit bénéfice en 2025 après des années de pertes) et la rotation des stocks`,`Le levier cache un risque : ROE dépendant du crédit fournisseurs ; protéger le coussin de 50 M€ de trésorerie`,`Position forte face à LGR : sites et clients à capter`,`Limites : entités françaises et non groupes ; bilans au 31/12 juste après Noël (stocks bas, dettes fournisseurs hautes) ; normes françaises = loyers hors bilan (gonfle la rotation des locataires) ; prix de transfert intra-groupe chez Smyths`],
     say:`Our main recommendation is to work on profitability, the weakest lever, through better purchasing terms and higher-margin kidult and exclusive ranges, while improving asset efficiency and protecting the cash buffer against the leverage risk.`,
     trap:`Connais les 4 limites : le jury adore demander "what are the limits of your analysis?".`},
    {n:11, t:`References`, what:`Palepu, Healy & Peek (2013), Soliman (2008), Vernimmen et al. (2022) ; comptes Pappers, Infonet, Verif, Rubypayeur, Datalegal, Societe.com, Companyweb ; presse.`, keys:[], say:``, trap:``}
  ],
  weak: [
    [`Données d'agrégateurs (Pappers, Infonet...)`, `Ce sont les comptes déposés au greffe repris par ces sites ; nos ROE recoupent ceux qu'ils publient.`],
    [`Société et non groupe`, `Les comptes consolidés détaillés ne sont pas publics ; la société SAS porte l'essentiel du retail français.`],

  numbers: [[`ROE KJ 2023 / 2024 / 2025`,`12,0 % / 8,6 % / 11,8 %`],[`ROE Smyths 2024`,`8,1 %`],[`Marge nette KJ / Smyths / LGR 2024`,`0,98 % / 1,66 % / -2,33 %`],[`Rotation KJ / Smyths / LGR 2024`,`1,37 / 2,93 / 1,87`],[`ROA KJ / Smyths / LGR 2024`,`1,34 % / 4,87 % / -4,38 %`],[`Multiplicateur KJ / Smyths 2024`,`6,40 / 1,66`],[`CA King Jouet SAS 2025`,`377,5 M€`],[`Résultat net KJ 2025`,`5,37 M€`],[`Capitaux propres LGR 2025`,`-8,1 M€`],[`BFR d'exploitation KJ 2024 / 2025`,`-60,9 M€ / -37,6 M€`],[`Trésorerie KJ 2025`,`≈50 M€`],[`Dette financière KJ`,`≈27-31 M€`],[`ROA KJ 2025 / LGR 2025`,`2,2 % / -6,5 %`]]

4: {
  name: `Part 4`, short: `Resources & VRIO`, color: `#D98E1F`,
  title: `Ressources et compétences de King Jouet : chaîne de valeur et VRIO`,
  task: `Identifier les principales ressources et compétences de King Jouet (chaîne de valeur de Porter utile), puis évaluer avec VRIO si chacune peut construire un avantage concurrentiel durable. Expliquer les raisons du succès et les limites.`,
  essentialFR: `Approche RBV (Wernerfelt, Barney, Grant). Nous cartographions la chaîne de valeur de King Jouet, listons 6 ressources et 5 compétences, puis les testons avec VRIO. Résultat : 3 avantages durables (réseau dense, gestion d'un réseau hybride succursales + affiliés, gouvernance familiale de long terme), 3 avantages temporaires (échelle d'achat, intégration d'acquisitions, innovation de formats), 4 parités et 1 désavantage (ressources financières, cohérent avec la Part 3). Le succès vient d'une combinaison historique difficile à copier ; les limites : rentabilité, avantages copiables, dépendance fournisseurs, intégration internationale, Smyths, succession.`,
  pitchEN: `In Part 4 we used the resource-based view to explain King Jouet's success. We mapped its value chain, identified six resources and five competences, and tested each with the VRIO framework. King Jouet has three sustained advantages: its dense store network, its skill in running integrated and affiliated stores together, and its long-term family governance. Its innovations are only temporary advantages because they are easy to copy, and its financial resources are a disadvantage, which is consistent with the thin margins we found in Part 3.`,
  slides: [
    {n:1, t:`Cover`, what:`Page de garde Part 4.`, keys:[], say:``, trap:``},
    {n:2, t:`Our approach: from resources to sustainable advantage`,
     what:`Démarche en 4 étapes + logique VRIO et ses 4 issues.`,
     keys:[`1 Identifier : chaîne de valeur de Porter adaptée à un distributeur (Porter, 1985)`,`2 Classer : ressources (ce que la firme possède / contrôle) vs compétences (ce qu'elle sait faire en les combinant)`,`3 Évaluer : VRIO (Valuable, Rare, costly to Imitate, Organised) (Barney & Hesterly, 2019)`,`4 Conclure : sources du succès et limites`,`Pas valuable → désavantage · pas rare → parité · imitable → avantage temporaire · V+R+I+O → avantage durable`,`Si V, R, I mais pas O → avantage non exploité. La durabilité vient de l'histoire, de la complexité sociale et de l'ambiguïté causale (Dierickx & Cool, 1989 ; Barney, 1991)`],
     say:`We followed four steps: identify resources with the value chain, classify them into resources and competences, assess them with VRIO, and conclude on the sources of success and the limits. A resource gives a sustained advantage only if it is valuable, rare, costly to imitate and if the firm is organised to exploit it.`,
     trap:`Ressource = ce que l'on possède (magasins, entrepôt, marque, cash). Compétence = ce que l'on sait faire en combinant les ressources (gérer un réseau hybride, intégrer des rachats).`},
    {n:3, t:`King Jouet in brief: 150 years of adaptation`,
     what:`Frise historique + 5 chiffres + ce que dit l'histoire.`,
     keys:[`1875 bazar familial à Voiron · 1950 grossiste en jouets · 1989 1er magasin King Jouet · 2001 bureau d'achat à Hong Kong et entrée en Suisse · 2011 Giochi Preziosi prend 51 % · 2020 reprise de Maxi Toys (95 magasins en France, 20 en Belgique) · 2022-23 King'Okaz et Jouet Score · 2024 la famille Gueydon revient à ≈70 % · 2025-26 KingDultes et 6e génération`,`458 M€ de CA groupe 2025 (+10 %) · 380 points de vente dont ≈1/4 affiliés · 13,7 % de PDM · ≈2 000 salariés · 32 % des ventes magasin avec des adultes au T1 2026`,`Croissance externe (Maxi Toys) + nouveaux concepts (occasion, kidultes) révèlent les compétences testées en VRIO`],
     say:`King Jouet has adapted for 150 years, from a family bazaar to wholesale, then retail, omnichannel and new formats, while keeping the same family in control. Today it has 458 million euros of group sales and 380 points of sale.`,
     trap:``},
    {n:4, t:`Porter's value chain applied to King Jouet`,
