/* ============ OUTILS THÉORIQUES ============ */
const TOOLS = [
  {id:`seg`, part:1, name:`Segmentation stratégique (DAS / SBU)`, def:`Découper l'activité en domaines d'activité stratégique : chaque DAS regroupe des offres qui partagent les mêmes critères d'achat, les mêmes concurrents et les mêmes FCS, avec une structure de coûts proche.`, authors:`Abell (1980) : 3 dimensions, clients, fonctions, technologies. Strategor (2019).`, applied:`Variables retenues : usage principal × profil utilisateur → 6 DAS + règle d'allocation par priorité.`},
  {id:`ksf`, part:1, name:`Facteurs clés de succès (FCS / KSF)`, def:`Ressource ou compétence indispensable pour réussir dans un DAS. On les déduit de ce qu'attendent les clients et de la façon dont on gagne face aux concurrents.`, authors:`Strategor (2019).`, applied:`4 FCS par DAS, chacun expliqué, + liens (encadré "Links") + tableau transversal et 3 cercles.`},
  {id:`bcg`, part:1, name:`Matrice des systèmes concurrentiels (BCG 2 / BCG 80)`, def:`Axe X : taille de l'avantage concurrentiel possible. Axe Y : nombre de sources de différenciation. 4 systèmes : VOLUME (peu de sources, gros avantage par l'échelle), SPÉCIALISATION (beaucoup de sources, gros avantage par niche), FRAGMENTATION (beaucoup de sources, petit avantage, la taille ne compte pas), IMPASSE (peu de sources, petit avantage, guerre des prix).`, authors:`Boston Consulting Group (1980).`, applied:`Volume : DAS 2. Spécialisation : DAS 1 et 6. Fragmentation : DAS 3 et 5. Impasse : DAS 4.`},
  {id:`porter`, part:2, name:`Les 5 forces de Porter`, def:`Rivalité entre concurrents, menace de nouveaux entrants, pouvoir de négociation des fournisseurs, pouvoir de négociation des clients, menace des substituts. Plus les forces sont fortes, plus la rentabilité moyenne du secteur est faible. Complémenteurs = 6e force.`, authors:`Porter (1979, 2008) ; Brandenburger & Nalebuff (1996) pour les complémenteurs.`, applied:`Rivalité, entrants, fournisseurs : forts. Clients, substituts : moyens. Marge King Jouet ≈1,4 %.`},
  {id:`groups`, part:2, name:`Groupes stratégiques`, def:`Ensemble d'entreprises d'un secteur qui suivent des stratégies similaires sur les dimensions stratégiques clés. Les barrières à la mobilité empêchent de passer facilement d'un groupe à l'autre.`, authors:`Hunt (1972) ; Porter (1980) ; Caves & Porter (1977) pour les barrières à la mobilité ; McGee & Thomas (1986).`, applied:`2 cartes, 4 variables, 7 groupes, business model décrit pour chacun (Sorescu et al., 2011 ; Osterwalder & Pigneur, 2010).`},
  {id:`dupont`, part:3, name:`Modèle DuPont`, def:`ROE = Marge nette (RN/CA) × Rotation de l'actif (CA/Actif) × Multiplicateur de capitaux propres (Actif/CP). Montre COMMENT une entreprise obtient sa rentabilité : profitabilité, efficacité ou levier.`, authors:`Soliman (2008) ; Palepu, Healy & Peek (2013) ; Vernimmen et al. (2022).`, applied:`King Jouet vs Smyths Toys FR vs Recreaclub (La Grande Récré), exercice 2024 + tendance 2023-2025.`},
  {id:`vc`, part:4, name:`Chaîne de valeur de Porter`, def:`Décompose l'entreprise en activités principales (logistique amont, opérations, logistique aval, marketing et ventes, service) et de soutien (infrastructure, RH, technologie, approvisionnement) pour voir où se crée la valeur et la marge.`, authors:`Porter (1985).`, applied:`Adaptée à un distributeur ; activités différenciantes : magasins, marketing et ventes, service.`},
  {id:`vrio`, part:4, name:`RBV et VRIO`, def:`Resource-based view : l'avantage vient des ressources et compétences internes. VRIO : Valuable (sinon désavantage), Rare (sinon parité), costly to Imitate (sinon avantage temporaire), Organised (si tout est oui → avantage durable ; si O manque → avantage non exploité).`, authors:`Wernerfelt (1984) ; Barney (1991) ; Grant (1991) ; Peteraf (1993) ; Barney & Hesterly (2019) ; Dierickx & Cool (1989) ; Teece et al. (1997).`, applied:`6 ressources + 5 compétences : 3 durables (R1, C1, C5), 3 temporaires (R5, C2, C4), 4 parités, 1 désavantage (R3).`}
];

/* ============ QUESTIONS DU JURY ============ */
const JURY = [
 // Part 1
 {p:1, q:`Why did you choose product use and user profile as segmentation variables?`, fr:`Ils changent les FCS, les concurrents et les coûts ; les autres variables existent dans chaque segment.`, a:`Because they change what matters to succeed. The user profile changes the buyer, the safety rules and the purpose of the purchase, and the main use changes the technologies, the competitors and the business model. Price, channel and country of origin exist inside every segment, so they refine the analysis but cannot define a segment.`},
 {p:1, q:`Why didn't you segment by distribution channel?`, fr:`Mêmes produits partout ; on classe le produit, pas le magasin.`, a:`Because the same products are sold in all channels, so the channel does not change the key success factors of the product. We classify the product, not the retailer. Distribution is analysed separately in Part 2.`},
 {p:1, q:`Where would you put a licensed Disney puzzle, a collector Barbie and a ride-on with a Paw Patrol licence?`, fr:`Puzzle = 5, Barbie collector = 6, porteur = 4.`, a:`The Disney puzzle goes to SBU 5, because rule-based games and puzzles come before character worlds in our allocation rule. The collector Barbie goes to SBU 6, collectibles. The ride-on goes to SBU 4, outdoor, because outdoor movement has priority over the licence.`},
 {p:1, q:`Explain the two axes of the BCG 2 matrix.`, fr:`X = taille de l'avantage ; Y = nombre de sources de différenciation.`, a:`The horizontal axis is the size of the competitive advantage a firm can build, and the vertical axis is the number of sources of differentiation in the segment. This gives four systems: volume, specialisation, fragmented and stalemate. It describes the competitive logic of a segment, not the position of a company.`},
 {p:1, q:`Why is SBU 2, licensed toys, in the volume system?`, fr:`Peu de sources (licence achetable), gros avantage par l'échelle.`, a:`Because there are few sources of differentiation: a licence can be bought and products look similar. But the advantage can be large thanks to scale in sourcing, media spending and retail listings. That is why global leaders like Mattel and Hasbro dominate it.`},
 {p:1, q:`Why are outdoor toys in a stalemate?`, fr:`Seulement prix et robustesse, imports et météo.`, a:`Because products are compared mainly on price and robustness, imports and general retailers compete strongly, and sales depend on the weather. No player can build a lasting advantage. A possible exit is product innovation or production closer to the market, as transport costs are high for bulky products.`},
 {p:1, q:`Asmodee is a very large company. Why is the board games segment fragmented?`, fr:`180+ éditeurs, 1 200 nouveautés, barrières basses ; évolue vers spécialisation.`, a:`Asmodee's size comes mainly from distribution. On the publishing side there are more than 180 publishers and about 1,200 new games a year, with low entry barriers, so the advantage remains small. That is why we drew an arrow towards specialisation: as distribution concentrates, the segment is changing.`},
 {p:1, q:`What are the links between your key success factors?`, fr:`Cercle licence-volume, sécurité-confiance, innovation-saisonnalité.`, a:`We found three main links. The licence-volume circle: licences and marketing create volume, and volume pays for new licences. The safety-trust circle: compliance builds trust and justifies a higher price. And the innovation-seasonality link: new products make 29 percent of sales but sell mostly at Christmas, so innovation needs a reliable supply chain.`},
 {p:1, q:`Your figure is 4.7 billion euros, but the brief says Xerfi gives more than 4 billion. Why?`, fr:`Xerfi ≈4,4 ; périmètres différents ; Circana plus détaillé.`, a:`Xerfi estimates about 4.4 billion and Circana 4.7 billion. The gap comes from different scopes and methods. We used Circana because it is a retail panel that gives details by category, target and channel, which we needed to build the segmentation.`},
 {p:1, q:`What are the main challenges of the sector?`, fr:`Natalité, kidultes, licences, saisonnalité, marketplaces, régulation.`, a:`The falling birth rate shrinks the core children market, while kidults open a new growth driver. On top of this, the sector depends on licences, 53 percent of sales happen in the fourth quarter, unsafe products arrive through non-EU marketplaces, and the new EU Toy Safety Regulation and the French EPR scheme add requirements.`},
 {p:1, q:`Where should a French SME compete?`, fr:`DAS 1 et 3, spécialisation, pas le volume.`, a:`A French SME cannot win on volume against global leaders. Its best chances are in SBU 1, early-age, and SBU 3, traditional and creative toys, by building a real specialist advantage based on trust, quality, origin and eco-design.`},
 {p:1, q:`Are kidults a segment?`, fr:`Non, un profil transversal.`, a:`No. Kidults are a user profile that cuts across several segments. They are dominant in SBU 6, collectibles and building sets, and important in SBU 5, board games, but a segment is defined by the main use combined with the user profile.`},
 // Part 2
 {p:2, q:`How did you define the industry for the five forces?`, fr:`Distribution de jouets neufs en France.`, a:`We defined it as the retail of new games and toys in France. Manufacturers are suppliers, consumers are buyers, and second-hand toys are treated as a substitute because they meet the same need with a different product.`},
 {p:2, q:`Which forces are the strongest and what is the consequence?`, fr:`Rivalité, entrants, fournisseurs ; marge fine.`, a:`Rivalry, supplier power and the threat of new entrants are high, while buyer power and substitutes are medium. The consequence is strong pressure on margins: King Jouet's net margin was only about 1.4 percent in 2025.`},
 {p:2, q:`Why is supplier power high in toy retail?`, fr:`LEGO, licences, intégration aval, allocations.`, a:`Because must-have brands are concentrated: LEGO is the first toy manufacturer in France and licences represent about 30 percent of sales. Some suppliers sell directly, like LEGO with 23 stores and Pop Mart, and scarce products like Pokémon cards are allocated by the distributor, Asmodee. Buying groups like JouéClub and Leclerc's Galec are the main counterweight.`},
 {p:2, q:`Why is buyer power only medium?`, fr:`Clients fragmentés, mais comparaison facile.`, a:`Consumers are millions of fragmented households, so none can negotiate individually. However, switching costs are zero, price comparison is easy and promotions are expected, so they put real pressure on prices. Kidults and parents who value advice are less price-sensitive.`},
 {p:2, q:`If barriers to entry exist, why is the threat of new entrants high?`, fr:`Contournées : rachat, marques, plateformes.`, a:`Barriers like logistics, working capital and supplier access exist, but recent entries show they can be bypassed. Smyths entered by buying PicWicToys, brands like LEGO and Pop Mart open their own stores, and platforms like Temu need no stores. The new EU 3 euro duty on small parcels is starting to raise barriers again.`},
 {p:2, q:`What are complementors and why did you include them?`, fr:`6e force : licenciés, films, réseaux sociaux.`, a:`Complementors are players whose products increase the value of yours. In toys, licensors, film releases and social media create demand that all retailers share. We added them following Brandenburger and Nalebuff, because they explain demand peaks like Pokémon or Lilo and Stitch.`},
 {p:2, q:`How did you choose the variables of the strategic group map?`, fr:`Séparer les BM, peu corrélées, barrières à la mobilité.`, a:`We used three criteria: the variables must separate business models, be weakly correlated with each other, and reflect mobility barriers. We kept toy specialisation and value proposition for the first map, and channel model and assortment depth for the second.`},
 {p:2, q:`Why didn't you use governance, integrated versus cooperative, as an axis?`, fr:`Pas visible pour le client.`, a:`Because it matters internally but does not distinguish business models from the customer's point of view: King Jouet and JouéClub look very similar in store. Governance is still important, and we come back to it in Part 4 as one of King Jouet's sustained advantages.`},
 {p:2, q:`Why did you build two maps?`, fr:`Vérifier la robustesse des groupes.`, a:`To test the robustness of our groups. If the seven groups stay distinct on two different pairs of variables, it confirms that they reflect real differences in business models and not just the choice of axes.`},
 {p:2, q:`What is the difference between groups 1 and 2?`, fr:`Conseil/animations vs prix/largeur ; magasins moyens vs big boxes.`, a:`Both are toy experts targeting the same families, but with opposite value propositions. Toy specialist networks like King Jouet offer advice, events and mid-size stores in cities and retail parks. Toy superstores like Smyths offer a huge range at low prices in big boxes with very low cost per square metre.`},
 {p:2, q:`What are the mobility barriers in this industry?`, fr:`Logistique, réseau, accès fournisseurs, BFR.`, a:`The main ones are logistics capacity, the store network, supplier allocations for scarce products and the working capital needed before Christmas. That is why Leclerc moving towards group 1 with toy stores, or King Jouet moving towards group 3 with KingDultes, takes time and investment.`},
 {p:2, q:`What is the key difference between groups 1 to 4 and groups 5 to 7?`, fr:`Gagnent sur le jouet vs jouet = une catégorie parmi d'autres.`, a:`Groups 1 to 4 make money on toys and must defend their margin with service, range or exclusivity. Groups 5 to 7 use toys as one category among many and can sell them with a low margin, which keeps constant pressure on specialists.`},
 {p:2, q:`Who are King Jouet's main competitors?`, fr:`JouéClub 15,6 %, Leclerc ≈12 %, Smyths.`, a:`The JouéClub group with 15.6 percent of the market, including La Grande Récré, E.Leclerc with about 12 percent, and Smyths, the fast-growing challenger with 55 stores. Online platforms like Amazon and Temu are a structural threat.`},
 // Part 3
 {p:3, q:`Explain the DuPont model.`, fr:`ROE = marge × rotation × levier.`, a:`DuPont breaks return on equity into three ratios: net profit margin, net income over sales, for profitability; asset turnover, sales over total assets, for efficiency; and the equity multiplier, total assets over equity, for leverage. Multiplying them gives ROE, and it shows how a company earns its return.`},
 {p:3, q:`Why did you choose Smyths and La Grande Récré?`, fr:`Rivaux directs, spécialistes intégrés, comptes publiés.`, a:`Both are toy specialists with integrated stores and published French accounts, so the comparison is fair. Smyths is King Jouet's fastest-growing challenger, and La Grande Récré is in the same strategic group and is the integrated arm of the market leader, the JouéClub group.`},
 {p:3, q:`Why not compare King Jouet with JouéClub, the market leader?`, fr:`EPSE = centrale coopérative (gros).`, a:`Because JouéClub's legal entity is a cooperative buying centre that sells to independent member stores. Its revenue and assets are wholesale, not retail, so its ratios would not be comparable. That is why we used Recreaclub, its integrated retail subsidiary.`},
 {p:3, q:`What is your key finding?`, fr:`Même ROE, routes différentes.`, a:`In 2024, King Jouet and Smyths had almost the same ROE, 8.6 versus 8.1 percent, but for different reasons. Smyths earned it from efficiency, with a return on assets of 4.9 percent and an asset turnover of 2.93. King Jouet relied on leverage, with a return on assets of only 1.3 percent and an equity multiplier of 6.4.`},
 {p:3, q:`Is King Jouet's high leverage dangerous?`, fr:`Pas bancaire ; crédit fournisseurs ; fragile si ralentissement.`, a:`Not in terms of bank debt: financial debt is moderate, around 27 to 31 million euros, and the company had about 50 million euros of cash in 2025. The leverage comes mainly from suppliers, as the operating working capital requirement is negative. It is efficient while sales grow, but the return would fall quickly if sales slowed or suppliers shortened payment terms.`},
 {p:3, q:`Why is La Grande Récré's ROE not meaningful?`, fr:`Perte / capitaux propres négatifs.`, a:`Because its equity is negative, minus 2.6 million in 2024 and minus 8.1 million in 2025. Dividing a loss by negative equity gives a positive number, like the 149 percent shown by data providers, which would wrongly suggest good performance.`},
 {p:3, q:`Why did King Jouet's sales jump 47 percent in 2024?`, fr:`Fusion New MT (ex Maxi Toys).`, a:`Mainly because of the merger of New MT, the company running the former Maxi Toys stores, into King Jouet SAS in June 2024. It is a legal and accounting effect, not organic growth.`},
 {p:3, q:`Why did King Jouet's ROE fall in 2024 and rise again in 2025?`, fr:`Marge écrasée 2024 ; reprise opérationnelle 2025.`, a:`In 2024 the net margin dropped from 2.6 to 1.0 percent after the merger of the former Maxi Toys stores, in a market that fell 0.7 percent. In 2025 ROE recovered to 11.8 percent thanks to a better margin and asset turnover, while leverage decreased, so the recovery is healthy.`},
 {p:3, q:`What are the limits of your analysis?`, fr:`Entités, bilans 31/12, loyers hors bilan, intra-groupe.`, a:`There are four main limits. We used French legal entities, not groups. Year-end balance sheets are taken just after Christmas, when stock is low and payables are high. Under French accounting rules, store leases are off balance sheet, which raises asset turnover for retailers that rent. And Smyths' figures may be affected by intra-group pricing.`},
 {p:3, q:`What do you recommend to King Jouet based on DuPont?`, fr:`Améliorer la marge, la rotation, protéger le cash.`, a:`First, improve profitability, the weakest lever, with better purchasing terms and higher-margin kidult and exclusive ranges. Second, improve efficiency by reviewing weak stores and stock rotation. Third, protect the cash buffer because its return depends on supplier credit.`},
 {p:3, q:`Why did you use King Jouet SAS and not the group?`, fr:`Comptes consolidés non publics en détail.`, a:`Because detailed consolidated accounts are not publicly available, while the statutory accounts of King Jouet SAS, which carries most of the French retail activity, are. The group had 458 million euros of sales in 2025, the SAS 377 million.`},
 // Part 4
 {p:4, q:`What is the difference between a resource and a competence?`, fr:`Posséder vs savoir faire.`, a:`A resource is something the firm owns or controls, like its stores, warehouse, brand or cash. A competence is what the firm is able to do by combining its resources, like managing a hybrid network or integrating acquisitions. We followed Grant and Prahalad and Hamel.`},
 {p:4, q:`Explain the VRIO framework.`, fr:`V, R, I, O et les 4 issues.`, a:`VRIO tests whether a resource is Valuable, Rare, costly to Imitate and whether the firm is Organised to exploit it. If it is not valuable, it is a disadvantage. If valuable but not rare, it gives parity. If rare but easy to imitate, a temporary advantage. If all four are met, a sustained competitive advantage.`},
 {p:4, q:`What are King Jouet's sustained competitive advantages?`, fr:`Réseau, réseau hybride, gouvernance familiale.`, a:`Three: its dense store network, its competence in running integrated and affiliated stores together under one concept, and its long-term family governance. They all come from history, tacit knowledge and social relations, which makes them very hard to copy.`},
 {p:4, q:`King Jouet has a 42,000 square metre warehouse. Why is logistics only parity?`, fr:`Smyths 43 000 m².`, a:`Because it is necessary but not rare: Smyths has a warehouse of the same size, 43,000 square metres, and any well-funded competitor can build one. It is a condition to compete, not a source of advantage.`},
 {p:4, q:`Why are financial resources a disadvantage?`, fr:`Lien avec la Part 3.`, a:`Because Part 3 showed a thin net margin of 1.4 percent, a return on assets of 2.2 percent and a return on equity that relies on supplier credit. This limits King Jouet's capacity to invest compared with Smyths, which belongs to a group with 2.53 billion euros of sales.`},
 {p:4, q:`Is the store network really rare if JouéClub has around 420 stores?`, fr:`Seul autre acteur comparable ; Smyths a dû racheter.`, a:`Rare means that few competitors have it. Among specialists, only the JouéClub group has a comparable network, and Smyths needed an acquisition to enter and still has 55 stores. Good locations take decades to build, which is what Dierickx and Cool call asset stock accumulation.`},
 {p:4, q:`Why is innovation only a temporary advantage?`, fr:`Facile à copier ; capacité dynamique.`, a:`Because King Jouet was first with the Jouet Score, King'Okaz and KingDultes, but competitors can copy a new format quickly: JouéClub also sells second-hand toys and everyone targets kidults. The advantage only lasts if innovation is continuous, which is a dynamic capability in Teece's sense.`},
 {p:4, q:`Why is family governance a sustained advantage?`, fr:`Histoire unique, stabilité.`, a:`Six generations, a majority regained in 2024 and a prepared succession give stability and patient, long-term decisions. It results from a unique history and cannot be bought or copied.`},
 {p:4, q:`Which value chain activities create most differentiation?`, fr:`Magasins, marketing et ventes, service.`, a:`Operations, meaning the stores and formats, marketing and sales with the kidult offer and the Jouet Score, and service with King'Okaz and the toy collection. Logistics and e-commerce are necessary but similar to competitors.`},
 {p:4, q:`What are King Jouet's main limits and what do you recommend?`, fr:`Rentabilité, copiable, fournisseurs, Belgique, Smyths, succession ; Protect/Renew/Fix.`, a:`Its main limits are thin profitability, advantages that are easy to copy, dependence on suppliers and Christmas, slow integration in Belgium, Smyths as a leaner challenger and the succession. We recommend to protect the three sustained advantages, renew temporary ones through continuous innovation, and fix profitability.`},
 {p:4, q:`How do Parts 3 and 4 connect?`, fr:`Marge fine = R3 ; réseau lourd = rotation faible.`, a:`They tell the same story. The thin margin and the leverage from supplier credit found with DuPont explain why financial resources are a disadvantage in VRIO. The large integrated network, a sustained advantage, also explains why King Jouet's asset turnover is lower than Smyths'.`},
 // Transversal
 {p:0, q:`Summarise your whole consulting mission in one minute.`, fr:`Le fil rouge des 4 parties.`, a:`We first analysed the French games and toys market, worth 4.7 billion euros, and split it into six strategic business units with their own success factors. Then we focused on retailers: Porter's five forces show a tough industry, and we identified seven strategic groups. For King Jouet, DuPont showed a return on equity similar to Smyths but driven by leverage rather than efficiency. Finally, VRIO showed that King Jouet's success comes from its network, its hybrid model and its family governance, while profitability remains its main weakness.`},
 {p:0, q:`How do the four parts connect?`, fr:`Marché → concurrence → performance → ressources.`, a:`Part 1 explains where to compete in the market. Part 2 explains how retailers compete and where King Jouet sits, in the toy specialist networks group. Part 3 measures King Jouet's performance against two direct rivals. Part 4 explains the internal reasons behind that performance, and its conclusions are consistent with Part 3.`},
 {p:0, q:`What was the hardest part of the work and how did you deal with it?`, fr:`Données publiques limitées.`, a:`The hardest part was finding reliable and comparable data, especially financial data for private companies. We used statutory accounts, cross-checked our ratios with published ROE figures, and clearly flagged every estimate and group assessment in the slides.`}
];

 {p:4,f:`Frise King Jouet`,b:`1875 bazar · 1950 grossiste · 1989 1er magasin · 2001 Hong Kong + Suisse · 2011 Giochi Preziosi 51 % · 2020 Maxi Toys · 2022-23 King'Okaz, Jouet Score · 2024 famille ≈70 % · 2025-26 KingDultes, 6e génération.`},
 {p:4,f:`Preuves du succès`,b:`CA SAS ×2 (183 → 377 M€, 2019-2025) · +0,3 pt de PDM en 2024 (marché -0,7 %) · adultes 21 % → 32 %.`},
 {p:4,f:`Les 6 limites`,b:`Rentabilité fine · avantages copiables · dépendance fournisseurs et Noël · intégration internationale lente (Belgique) · Smyths · succession.`},
 {p:4,f:`Recommandations`,b:`PROTECT les avantages durables · RENEW les temporaires (capacité dynamique) · FIX la rentabilité.`}

4: {
  title: `King Jouet's resources and competences: value chain and VRIO`,
  task: `Identify King Jouet's main resources and competences (Porter's value chain can help), then use VRIO to assess whether each can build a sustainable competitive advantage. Explain the reasons for success and the limits.`,
  essential: `Resource-based view (Wernerfelt, Barney, Grant). We map King Jouet's value chain, list 6 resources and 5 competences, then test them with VRIO. Result: 3 sustained advantages (dense network, running a hybrid network of integrated + affiliated stores, long-term family governance), 3 temporary advantages (purchasing scale, integrating acquisitions, format innovation), 4 parities and 1 disadvantage (financial resources, consistent with Part 3). Success comes from a hard-to-copy historical combination; limits: profitability, copyable advantages, supplier dependence, international integration, Smyths, succession.`,
  slides: [
    {what:`Part 4 cover page.`, keys:[], trap:``},
    {what:`4-step approach + VRIO logic and its 4 outcomes.`,
     keys:[`1 Identify: Porter's value chain adapted to a retailer (Porter, 1985)`,`2 Classify: resources (what the firm owns / controls) vs competences (what it can do by combining them)`,`3 Assess: VRIO (Valuable, Rare, costly to Imitate, Organised) (Barney & Hesterly, 2019)`,`4 Conclude: sources of success and limits`,`Not valuable → disadvantage · not rare → parity · imitable → temporary advantage · V+R+I+O → sustained advantage`,`If V, R, I but not O → unexploited advantage. Sustainability comes from history, social complexity and causal ambiguity (Dierickx & Cool, 1989; Barney, 1991)`],
     trap:`Resource = what you own (stores, warehouse, brand, cash). Competence = what you can do by combining resources (run a hybrid network, integrate acquisitions).`},
    {what:`Timeline + 5 figures + what history tells us.`,
     keys:[`1875 family bazaar in Voiron · 1950 toy wholesaler · 1989 first King Jouet store · 2001 Hong Kong buying office and entry into Switzerland · 2011 Giochi Preziosi takes 51% · 2020 Maxi Toys takeover (95 stores in France, 20 in Belgium) · 2022-23 King'Okaz and Jouet Score · 2024 Gueydon family back to ≈70% · 2025-26 KingDultes and 6th generation`,`€458m group sales in 2025 (+10%) · 380 points of sale, ≈1/4 affiliated · 13.7% market share · ≈2,000 employees · 32% of store sales made with adults in Q1 2026`,`External growth (Maxi Toys) + new concepts (second-hand, kidults) reveal the competences tested with VRIO`],
     trap:``},
    {what:`Support and primary activities with key resources and competences; in orange, the activities where King Jouet differentiates most (group assessment). Margin: 1.4% net.`,
     keys:[`Infrastructure: family governance (≈70%), 6th generation, mixed network of integrated / affiliated stores, capital opened to employees and affiliates in 2025`,`HR: ≈2,000 employees, in-store advice, seasonal reinforcement, affiliate entrepreneurs`,`Technology: e-commerce since 2010 (Jouet Online €27.5m in 2025), Jouet Score (12 criteria), Freepry tool to value second-hand toys`,`Procurement: buying power of a 13.7% market share, Hong Kong office since 2001, supplier data for the Jouet Score`,`Inbound logistics: 42,000 m² warehouse in Rives, King Jouet Logistique company`,`ORANGE Operations (stores): 380 points of sale, out-of-town and city-centre formats, 6 KingDultes`,`Outbound / omnichannel: online +9% (2024), ≈15% of network sales digital (2023), click and collect`,`ORANGE Marketing and sales: national brand, Christmas catalogue, kidult offer (kingdultes.com, 3,000 items), Jouet Score`,`ORANGE Service: King'Okaz corners (30 stores), toy collection with a €5 voucher (Ecomaison)`],
     trap:``},
    {what:`Table of 6 resources and 5 competences with evidence.`,
     keys:[`R1 Dense network (tangible): 380 points of sale (FR, BE, LU, CH, Morocco), 330 in France`,`R2 Logistics platform (tangible): 42,000 m², €308m of flows in 2025`,`R3 Financial resources: €50m of cash but €45.6m of equity and a 1.4% margin`,`R4 Brand and heritage (intangible): national brand, family business since 1875`,`R5 Purchasing scale and supplier relations (relational): 13.7%, office in Asia`,`R6 Staff expertise (human): ≈2,000 advising employees`,`C1 Running a hybrid network · C2 Integrating acquisitions (Maxi Toys rebranded by 2023) · C3 Omnichannel (website since 2010) · C4 Format and service innovation (Jouet Score, King'Okaz, KingDultes) · C5 Long-term family governance`],
     trap:`Resource / competence distinction: Grant (1991) and Prahalad & Hamel (1990).`},
    {what:`VRIO test of the 6 resources with justification.`,
     keys:[`R1 Dense network: ✓ ✓ ✓ ✓ → SUSTAINED ADVANTAGE (among specialists, only JouéClub has a comparable network ≈420; good locations take decades to build; Smyths had to buy and has 55 stores)`,`R2 Logistics: ✓ ✗ ✗ ✓ → PARITY (Smyths has a warehouse of the same size, 43,000 m²)`,`R3 Finance: ✗ ✗ ✗ ~ → DISADVANTAGE (margin 1.4%, ROA 2.2%, ROE relying on supplier credit; limits investment against Smyths' €2.53bn group)`,`R4 Brand and heritage: ✓ ✗ ~ ✓ → PARITY (JouéClub, LGR, Smyths also have strong brands; customers mainly choose on range and price)`,`R5 Purchasing scale: ✓ ~ ✓ ✓ → TEMPORARY ADVANTAGE (13.7% gives allocations and terms, but JouéClub 15.6% and Leclerc ≈12% have a similar weight)`,`R6 Staff expertise: ✓ ✗ ~ ✓ → PARITY (all specialists give advice; it mainly protects against online players)`],
     trap:`"Is the network really rare if JouéClub has 420 stores?" → Rare = few competitors have it. Among specialists, only one other player has a comparable network; Smyths had to make an acquisition to enter.`},
    {what:`VRIO test of the 5 competences.`,
     keys:[`C1 Hybrid network: ✓ ✓ ✓ ✓ → SUSTAINED ADVANTAGE (control + local entrepreneurship; capital opened to employees and affiliates in 2025, presented as a first; tacit and socially complex know-how)`,`C2 Integrating acquisitions: ✓ ✓ ~ ~ → TEMPORARY ADVANTAGE (≈120 Maxi Toys stores rebranded, but King Jouet Belgique lost money 2022-2024, small profit in 2025)`,`C3 Omnichannel: ✓ ✗ ✗ ✓ → PARITY (all major rivals + Amazon offer the same)`,`C4 Format innovation: ✓ ✓ ✗ ✓ → TEMPORARY ADVANTAGE (first with Jouet Score, King'Okaz, KingDultes; adults 21% → 32%; easy to copy)`,`C5 Family governance: ✓ ✓ ✓ ✓ → SUSTAINED ADVANTAGE (6 generations, majority regained in 2024, prepared succession; a unique history that cannot be bought)`],
     trap:`For C4: the advantage only lasts if innovation is continuous, which is a dynamic capability (Teece et al., 1997).`},
    {what:`The 11 items classified into the 4 VRIO outcomes.`,
     keys:[`Disadvantage: R3 Finance`,`Parity: R2 Logistics, R4 Brand, R6 Staff, C3 Omnichannel`,`Temporary: R5 Purchasing, C2 Acquisitions, C4 Innovation`,`Sustained: R1 Network, C1 Hybrid network, C5 Family governance`,`Reading: the lasting advantage does not come from an asset you can buy (warehouse, website, brand) but from organisational and historical factors`],
     trap:``},
    {what:`Diagram: family governance → hybrid network of 380 stores → continuous innovation ⇒ growth and market share gains.`,
     keys:[`King Jouet SAS sales ×2 between 2019 (€183m) and 2025 (€377m)`,`+0.3 pt of market share in 2024 in a falling market (-0.7%)`,`Adults: 21% → 32% of store sales (2025 → Q1 2026)`,`Why hard to copy: each element can be imitated, but their combination comes from 150 years of history and social relations with affiliates and staff (causal ambiguity, Barney 1991; Dierickx & Cool 1989)`],
     trap:`Dierickx & Cool (1989): asset stocks accumulate over time and you cannot speed this up (time compression diseconomies).`},
    {what:`6 limits + Protect / Renew / Fix recommendations.`,
     keys:[`Thin profitability: margin 1.4%, ROA 2.2% (2025); in 2024 its ROA was 1/4 of Smyths'`,`Easy-to-copy advantages: JouéClub also sells second-hand toys, everyone targets kidults`,`Dependence on suppliers and Christmas: LEGO, Pokémon; 53% of sales in Q4`,`Slow international integration: King Jouet Belgique -€4.4m (2023), -€2.0m (2024), equity -€5.9m despite the return to profit in 2025`,`Strong challenger: Smyths, a leaner model (turnover 2.9 vs 1.4-1.6)`,`Succession: the move to the 6th generation is a sensitive time`,`PROTECT the 3 sustained advantages · RENEW temporary ones with a steady flow of innovations (dynamic capability) · FIX profitability (kidult and exclusive ranges, review of weak stores)`],
     trap:``},
    {what:`Barney (1991), Barney & Hesterly (2019), Dierickx & Cool (1989), Grant (1991), Peteraf (1993), Porter (1985), Prahalad & Hamel (1990), Teece, Pisano & Shuen (1997), Wernerfelt (1984); company and press sources.`, keys:[], trap:``}
  ],
  weak: [
    [`VRIO is subjective`, `Yes, it is a group assessment, but each cell is justified by evidence (figures, comparison with Smyths, JouéClub, Leclerc).`],
    [`R5 "partly rare" but a temporary advantage`, `The advantage exists mainly against small retailers; JouéClub and Leclerc have a comparable weight, so it is not sustainable.`],
    [`"First in the sector" for opening the capital`, `That is what the company states; we say "presented as a first".`],
    [`Link with Part 3`, `R3 as a disadvantage = the thin margin and supplier leverage found with DuPont; the heavy network explains a lower turnover than Smyths.`]
  ],
  numbers: [[`Founded`,`1875, Voiron (Isère)`],[`First King Jouet store`,`1989`],[`Maxi Toys takeover`,`2020: 95 FR + 20 BE (+6 CH)`],[`Gueydon family stake`,`≈70% (2024)`],[`Group sales 2025`,`€458m (+10%)`],[`King Jouet SAS sales 2019 → 2025`,`€183m → €377m`],[`Points of sale`,`380, ≈1/4 affiliated`],[`Employees`,`≈2,000`],[`Sales to adults`,`21% (2025) → 32% (Q1 2026)`],[`KingDultes`,`6 stores, 3,000 items online`],[`King'Okaz`,`30 stores`],[`Jouet Score`,`12 criteria; 3,000 items rated 3 to 5`],[`Rives warehouse`,`42,000 m²`],[`Jouet Online 2025`,`€27.5m`],[`King Jouet Belgique losses`,`-€4.4m (2023), -€2.0m (2024)`],[`Sustained advantages`,`R1, C1, C5`]]
}

  {name:`Strategic segmentation (SBUs)`, def:`Split the business into strategic business units: each SBU groups offers that share the same buying criteria, the same competitors and the same KSFs, with a similar cost structure.`, authors:`Abell (1980): 3 dimensions, customers, functions, technologies. Strategor (2019).`, applied:`Variables kept: main use × user profile → 6 SBUs + a priority allocation rule.`},
  {name:`Key success factors (KSFs)`, def:`A resource or a skill a firm must have to succeed in an SBU. They are derived from what customers expect and from how firms win against competitors.`, authors:`Strategor (2019).`, applied:`4 KSFs per SBU, each explained, + links ("Links" box) + a cross-SBU table and 3 circles.`},
  {name:`Competitive systems matrix (BCG 2 / BCG 80)`, def:`X axis: size of the possible competitive advantage. Y axis: number of sources of differentiation. 4 systems: VOLUME (few sources, large advantage through scale), SPECIALISATION (many sources, large advantage through niches), FRAGMENTED (many sources, small advantage, size does not matter), STALEMATE (few sources, small advantage, price war).`, authors:`Boston Consulting Group (1980).`, applied:`Volume: SBU 2. Specialisation: SBUs 1 and 6. Fragmented: SBUs 3 and 5. Stalemate: SBU 4.`},
  {name:`Porter's five forces`, def:`Rivalry among competitors, threat of new entrants, bargaining power of suppliers, bargaining power of buyers, threat of substitutes. The stronger the forces, the lower the average profitability of the industry. Complementors = 6th force.`, authors:`Porter (1979, 2008); Brandenburger & Nalebuff (1996) for complementors.`, applied:`Rivalry, entrants, suppliers: high. Buyers, substitutes: medium. King Jouet margin ≈1.4%.`},
  {name:`Strategic groups`, def:`A set of firms in an industry that follow similar strategies on the key strategic dimensions. Mobility barriers prevent firms from moving easily from one group to another.`, authors:`Hunt (1972); Porter (1980); Caves & Porter (1977) for mobility barriers; McGee & Thomas (1986).`, applied:`2 maps, 4 variables, 7 groups, a business model described for each (Sorescu et al., 2011; Osterwalder & Pigneur, 2010).`},

  {name:`Porter's value chain`, def:`Breaks the firm into primary activities (inbound logistics, operations, outbound logistics, marketing and sales, service) and support activities (infrastructure, HR, technology, procurement) to see where value and margin are created.`, authors:`Porter (1985).`, applied:`Adapted to a retailer; differentiating activities: stores, marketing and sales, service.`},
  {name:`RBV and VRIO`, def:`Resource-based view: advantage comes from internal resources and competences. VRIO: Valuable (otherwise disadvantage), Rare (otherwise parity), costly to Imitate (otherwise temporary advantage), Organised (if all yes → sustained advantage; if O is missing → unexploited advantage).`, authors:`Wernerfelt (1984); Barney (1991); Grant (1991); Peteraf (1993); Barney & Hesterly (2019); Dierickx & Cool (1989); Teece et al. (1997).`, applied:`6 resources + 5 competences: 3 sustained (R1, C1, C5), 3 temporary (R5, C2, C4), 4 parities, 1 disadvantage (R3).`}

 {p:1, q:`Board games (SBU 5) are classified as:`, o:[`Volume`,`Specialisation`,`Fragmented`,`Stalemate`], a:2, e:`Very many sources, small advantage (180+ publishers), arrow towards specialisation.`},
 {p:1, q:`Vertical axis of BCG 80?`, o:[`Market growth`,`Relative market share`,`Number of sources of differentiation`,`Size of the advantage`], a:2, e:`Horizontal = size of the advantage. Do not confuse it with the growth-share matrix.`},
 {p:1, q:`The "safety-trust" circle mainly concerns:`, o:[`SBUs 2 and 6`,`SBUs 1 and 3`,`SBUs 4 and 5`,`SBUs 5 and 6`], a:1, e:`Compliance justifies a higher price, a key lever for early-age and traditional toys.`},
 {p:1, q:`France's total fertility rate in 2025:`, o:[`1.40`,`1.56`,`1.61`,`1.80`], a:1, e:`1.56, the lowest since 1918 (1.61 in 2024).`},
 {p:2, q:`Market share of the specialist and multi-specialist channel in 2025:`, o:[`25%`,`35%`,`42%`,`60%`], a:2, e:`42%, about 45% in September 2026.`},
 {p:2, q:`Which force did we rate MEDIUM?`, o:[`Rivalry`,`New entrants`,`Supplier power`,`Buyer power`], a:3, e:`Buyers and substitutes = medium; the other three = high.`},
 {p:2, q:`Market share of the JouéClub group (JouéClub + LGR):`, o:[`12%`,`13.7%`,`15.6%`,`42%`], a:2, e:`15.6% of the total market and 42% of the specialist channel.`},
 {p:2, q:`How did Smyths enter France?`, o:[`Built from scratch`,`Bought PicWicToys in 2022`,`Bought La Grande Récré`,`Franchise with Leclerc`], a:1, e:`PicWicToys = ex Toys"R"Us France + Picwic.`},
 {p:2, q:`How many strategic groups did we identify?`, o:[`4`,`5`,`6`,`7`], a:3, e:`7 groups, from 1 Specialist networks to 7 Platforms.`},
 {p:2, q:`Why is governance not an axis of the map?`, o:[`Data not found`,`It does not distinguish models from the customer's view`,`Too correlated with price`,`Forbidden by Porter`], a:1, e:`King Jouet and JouéClub look alike to customers.`},
 {p:2, q:`Complementors (6th force) are:`, o:[`Chinese manufacturers`,`Licensors, films, social media`,`Banks`,`Second-hand websites`], a:1, e:`They create demand shared by everyone (Brandenburger & Nalebuff, 1996).`},
 {p:2, q:`EU customs duty on small parcels (< €150) since July 2026:`, o:[`€2`,`€3`,`€5`,`€10`], a:1, e:`€3; it replaces the French €2 tax (March 2026), now suspended.`},
 {p:2, q:`Second-hand toy market in 2025:`, o:[`€169m`,`€378m`,`€1.1bn`,`€5.86bn`], a:1, e:`€378m (7.3% of the market, +14%); €169m in 2021.`},
 {p:2, q:`Key difference between groups 1-4 and 5-7:`, o:[`Online vs store`,`Make money on toys vs toys = one category among others`,`French vs foreign`,`Large vs small`], a:1, e:`Groups 5-7 can sell toys at a low margin.`},
 {p:2, q:`Smyths Toys' strategic group:`, o:[`1 Specialist networks`,`2 Toy superstores`,`3 Brand stores`,`5 Food retail`], a:1, e:`Big boxes, huge range, low prices.`},
 {p:2, q:`Framework used to describe the business models:`, o:[`BCG 80`,`Sorescu et al. (2011) and Osterwalder & Pigneur (2010)`,`VRIO`,`PESTEL`], a:1, e:`Value proposition, target, format and channels, profit formula, key resources.`},
 {p:3, q:`Formula of the equity multiplier:`, o:[`NI / Sales`,`Sales / Assets`,`Assets / Equity`,`NI / Assets`], a:2, e:`Total assets / equity.`},
 {p:3, q:`King Jouet's ROE in 2024:`, o:[`1.34%`,`8.1%`,`8.6%`,`11.8%`], a:2, e:`8.6%; Smyths 8.1%; KJ 2025 11.8%.`},
 {p:3, q:`Smyths' ROA in 2024:`, o:[`1.34%`,`2.21%`,`4.87%`,`8.1%`], a:2, e:`4.87%, vs 1.34% for King Jouet.`},
 {p:3, q:`Smyths' asset turnover in 2024:`, o:[`1.37`,`1.66`,`1.87`,`2.93`], a:3, e:`2.93, more than twice King Jouet (1.37).`},
 {p:3, q:`King Jouet's equity multiplier in 2024:`, o:[`1.66`,`4.27`,`5.33`,`6.40`], a:3, e:`6.40 (5.33 in 2025, 4.27 in 2023).`},
 {p:3, q:`Why is La Grande Récré's ROE not meaningful?`, o:[`Missing data`,`Negative equity`,`8-month year`,`Foreign company`], a:1, e:`Loss / negative equity = a misleading positive ROE (+149%).`},
 {p:3, q:`Why didn't we use JouéClub (EPSE)?`, o:[`Too small`,`Accounts not published`,`Cooperative buying centre: wholesale revenue`,`Not a competitor`], a:2, e:`Its ratios would describe a wholesaler. We use Recreaclub.`},
 {p:3, q:`Main cause of King Jouet SAS's 2024 sales jump (+47%)?`, o:[`Pokémon`,`Merger of New MT (ex Maxi Toys)`,`KingDultes opening`,`Inflation`], a:1, e:`Merger in June 2024: a legal effect, not organic growth.`},
 {p:3, q:`King Jouet's leverage mainly comes from:`, o:[`Bank debt`,`Supplier credit (negative operating WCR)`,`A capital increase`,`Leasing`], a:1, e:`Operating WCR -€60.9m (2024); financial debt ≈€27-31m; €50m of cash.`},
 {p:3, q:`King Jouet's net margin in 2025:`, o:[`0.98%`,`1.42%`,`1.66%`,`2.62%`], a:1, e:`1.42% (0.98% in 2024, 2.62% in 2023).`},
 {p:3, q:`Which is NOT a limit we mentioned?`, o:[`Entities, not groups`,`31 Dec balance sheets after Christmas`,`Leases off balance sheet under French GAAP`,`EUR/USD exchange rate`], a:3, e:`The 4 limits: entities, 31 Dec balance sheets, off-balance-sheet leases, Smyths intra-group pricing.`},
 {p:3, q:`King Jouet's 2025 recovery is "healthy" because:`, o:[`Leverage increases`,`It comes from margin and turnover, leverage falls`,`Sales double`,`Debt disappears`], a:1, e:`Margin +0.4 pt, turnover 1.55, multiplier 5.33.`},
 {p:4, q:`In VRIO, a resource that is valuable but not rare gives:`, o:[`Disadvantage`,`Parity`,`Temporary advantage`,`Sustained advantage`], a:1, e:`Not rare → competitive parity.`},
 {p:4, q:`A resource that is V and R but easy to imitate gives:`, o:[`Parity`,`Temporary advantage`,`Sustained advantage`,`Unexploited advantage`], a:1, e:`Imitable → temporary advantage.`},
 {p:4, q:`Which is NOT a sustained advantage of King Jouet?`, o:[`Dense network`,`Hybrid network`,`Family governance`,`Format innovation`], a:3, e:`Innovation is temporary (easy to copy).`},
 {p:4, q:`Why is logistics only parity?`, o:[`Too small`,`Smyths has an equivalent warehouse (43,000 m²)`,`Outsourced`,`Not valuable`], a:1, e:`Valuable but not rare.`},
 {p:4, q:`Which item is a competitive DISADVANTAGE?`, o:[`R2 Logistics`,`R3 Financial resources`,`R4 Brand`,`C3 Omnichannel`], a:1, e:`Consistent with Part 3: margin 1.4%, ROA 2.2%.`},
 {p:4, q:`King Jouet was founded in:`, o:[`1875`,`1950`,`1989`,`2001`], a:0, e:`1875 bazaar in Voiron; 1950 wholesaler; 1989 first King Jouet store.`},
 {p:4, q:`Share of capital held by the Gueydon family since 2024:`, o:[`49%`,`51%`,`≈70%`,`100%`], a:2, e:`After selling 51% to the Italian group in 2011.`},
 {p:4, q:`Share of store sales made with adults in Q1 2026:`, o:[`13%`,`21%`,`32%`,`45%`], a:2, e:`21% in 2025, 32% in Q1 2026.`},
 {p:4, q:`Authors of "asset stock accumulation" (you cannot speed up time):`, o:[`Prahalad & Hamel`,`Dierickx & Cool`,`Teece, Pisano & Shuen`,`Wernerfelt`], a:1, e:`Dierickx & Cool (1989).`},
 {p:4, q:`Value chain activities where King Jouet differentiates most:`, o:[`Inbound logistics, technology, HR`,`Operations (stores), marketing and sales, service`,`Procurement only`,`Infrastructure and outbound logistics`], a:1, e:`In orange on the slide.`},
 {p:4, q:`The 3 final recommendations:`, o:[`Grow / Cut / Sell`,`Protect / Renew / Fix`,`Buy / Build / Borrow`,`Lead / Follow / Exit`], a:1, e:`Protect sustained advantages, renew temporary ones, fix profitability.`},
 {p:4, q:`Continuous innovation as a source of advantage relates to:`, o:[`BCG 80`,`Dynamic capabilities (Teece et al., 1997)`,`The five forces`,`The value chain`], a:1, e:`Renewing temporary advantages.`}
];

const CARDS_EN = [
 {p:1,f:`Definition of an SBU`,b:`A set of offers with the same buying criteria, competitors and KSFs (Strategor; Abell 1980: customers, functions, technologies).`},
 {p:1,f:`The 6 SBUs`,b:`1 Early-age and preschool · 2 Licensed and character · 3 Traditional and creative · 4 Outdoor and sports · 5 Board games and puzzles · 6 Kidult collectibles and building.`},
 {p:1,f:`Order of the allocation rule`,b:`Preschool learning (1) → outdoor (4) → building / collecting (6) → rules / puzzles (5) → characters (2) → generic imitation / creativity (3).`},
 {p:1,f:`BCG 80 systems of our SBUs`,b:`Volume: 2 · Specialisation: 1 and 6 · Fragmented: 3 and 5 · Stalemate: 4.`},
 {p:1,f:`The 4 BCG 80 systems`,b:`Volume (few sources, large advantage), Specialisation (many, large), Fragmented (many, small), Stalemate (few, small).`},
 {p:1,f:`KSFs of SBU 2 (licences)`,b:`Access to licences · marketing power · economies of scale and sourcing · Christmas listing. Circle: expensive licence → volume → marketing → favours the leaders.`},
 {p:1,f:`KSFs of SBU 6 (collectibles)`,b:`IP control · scarcity management · community engagement · dedicated premium retail. IP → scarcity → community → premium price.`},
 {p:1,f:`The 3 KSF circles`,b:`Licence-volume (SBUs 2, 6) · Safety-trust (SBUs 1, 3) · Innovation-seasonality (new products = 29% of sales, sold at Christmas).`},
 {p:1,f:`The 6 sector challenges`,b:`Birth rate (threat) · Wider target (opportunity) · Licences (mixed) · Seasonality (threat) · Offshoring and marketplaces (threat) · Regulation and circularity (mixed).`},
 {p:1,f:`EU Regulation 2025/2509`,b:`New toy safety regulation: bans PFAS, requires a digital product passport; fully applicable in 2030.`},
 {p:2,f:`Intensity of the 5 forces`,b:`Rivalry HIGH · Entrants HIGH · Suppliers HIGH · Buyers MEDIUM · Substitutes MEDIUM (+ complementors).`},
 {p:2,f:`The 7 strategic groups`,b:`1 Specialist networks · 2 Toy superstores · 3 Brand stores · 4 Cultural multi-specialists · 5 Food retail · 6 Non-food discounters · 7 Online platforms.`},
 {p:2,f:`Axes of the 2 maps`,b:`Map 1: toy specialisation (X) × value proposition (Y). Map 2: channel model (X) × assortment depth (Y).`},
 {p:2,f:`3 criteria for a good axis`,b:`Separate business models · weakly correlated with the other axis · reflect mobility barriers.`},
 {p:2,f:`Top 3 of the market`,b:`JouéClub group 15.6% · King Jouet 13.7% · E.Leclerc ≈12% ⇒ ≈41%.`},
 {p:2,f:`Barriers to entry`,b:`Logistics (42-43,000 m² warehouses) · working capital before Christmas · supplier access (allocations) · network and brand.`},
 {p:2,f:`Why the threat of entry stays high`,b:`Entry by acquisition (Smyths) · brands becoming retailers (LEGO, Pop Mart) · store-less platforms (Temu).`},
 {p:2,f:`Mobility moves (map 1)`,b:`King Jouet → group 3 with KingDultes · Leclerc → group 1 with its toy stores.`},
 {p:2,f:`Group 1 business model`,b:`Choice, advice, events · families + kidults · mid-size stores + online · Christmas volume, buying-group margins, fees · network, central buying, logistics, staff.`},
 {p:3,f:`DuPont formula`,b:`ROE = (NI/Sales) × (Sales/Assets) × (Assets/Equity) = net margin × asset turnover × equity multiplier.`},
 {p:3,f:`King Jouet 2024 ratios`,b:`Margin 0.98% · Turnover 1.37 · ROA 1.34% · Multiplier 6.40 · ROE 8.6%.`},
 {p:3,f:`Smyths 2024 ratios`,b:`Margin 1.66% · Turnover 2.93 · ROA 4.87% · Multiplier 1.66 · ROE 8.1%.`},
 {p:3,f:`La Grande Récré 2024 ratios`,b:`Margin -2.33% · Turnover 1.87 · ROA -4.38% · Multiplier and ROE not meaningful (negative equity).`},
 {p:3,f:`Part 3 key message`,b:`Same ROE for KJ and Smyths, different routes: Smyths through efficiency, King Jouet through leverage (supplier credit).`},
 {p:3,f:`King Jouet ROE over time`,b:`12.0% (2023) → 8.6% (2024, New MT merger, market -0.7%) → 11.8% (2025, operating recovery).`},
 {p:3,f:`4 limits of the DuPont analysis`,b:`Entities, not groups · 31 Dec balance sheets after Christmas · off-balance-sheet leases (French GAAP) · intra-group pricing at Smyths.`},
 {p:3,f:`Why Smyths and LGR?`,b:`Integrated specialists with published French accounts; Smyths = challenger (group 2); LGR = same group (1) and integrated arm of the leader JouéClub.`},
 {p:4,f:`VRIO: the 4 outcomes`,b:`Not V → disadvantage · V not R → parity · V R but imitable → temporary · V R I O → sustained (V R I without O → unexploited).`},
 {p:4,f:`The 3 sustained advantages`,b:`R1 Dense network · C1 Running a hybrid network (integrated + affiliated) · C5 Long-term family governance.`},
 {p:4,f:`The 3 temporary advantages`,b:`R5 Purchasing scale · C2 Integrating acquisitions · C4 Format and service innovation.`},
 {p:4,f:`The 4 parities`,b:`R2 Logistics · R4 Brand and heritage · R6 Staff expertise · C3 Omnichannel.`},
 {p:4,f:`The disadvantage`,b:`R3 Financial resources (margin 1.4%, ROA 2.2%, ROE relying on supplier credit).`},
 {p:4,f:`Resource vs competence`,b:`Resource = what you own or control. Competence = what you can do by combining resources (Grant 1991; Prahalad & Hamel 1990).`},
 {p:4,f:`King Jouet timeline`,b:`1875 bazaar · 1950 wholesaler · 1989 first store · 2001 Hong Kong + Switzerland · 2011 Giochi Preziosi 51% · 2020 Maxi Toys · 2022-23 King'Okaz, Jouet Score · 2024 family ≈70% · 2025-26 KingDultes, 6th generation.`},
 {p:4,f:`Evidence of success`,b:`SAS sales ×2 (€183m → €377m, 2019-2025) · +0.3 pt of market share in 2024 (market -0.7%) · adults 21% → 32%.`},
 {p:4,f:`The 6 limits`,b:`Thin profitability · copyable advantages · dependence on suppliers and Christmas · slow international integration (Belgium) · Smyths · succession.`},
 {p:4,f:`Recommendations`,b:`PROTECT sustained advantages · RENEW temporary ones (dynamic capability) · FIX profitability.`}
];

  vrioNames:[`R1 Dense network`,`R2 Logistics`,`R3 Finance`,`R4 Brand, heritage`,`R5 Purchasing scale`,`R6 Staff`,`C1 Hybrid network`,`C2 Acquisitions`,`C3 Omnichannel`,`C4 Format innovation`,`C5 Family governance`],
  outc:{dur:`Sustained`,par:`Parity`,dis:`Disadvantage`,tmp:`Temporary`}, legend:[`✓ yes`,`~ partly`,`✗ no`],
  juryTitle:`Jury questions`, known:(a,b)=>`${a}/${b} known`, all:`All`, transversal:`Cross-part`, global:`Global`,
  fAll:`All`, fTodo:`Not known yet`, fBad:`To review`, empty:`Nothing here. 🎉`,
  keyIdea:`Key idea: `, modelAns:`Model answer`, toggleAns:`Show / hide answer`, knew:`I knew it`, review:`To review`,
  drawn:`The jury drew`, step1:`Step 1 · Present the part in 1 minute`, startTimer:`Start the timer`, seePitch:`See the model pitch`, modelPitch:`Model pitch`,
  step2:`Step 2 · Jury questions →`, redraw:`Draw another part`, stop:`Stop!`,
  qOf:(p,i,n)=>`${p} · question ${i}/${n}`, answer45:`Answer out loud (45 s)`, seeAns:`See the answer`, knewNext:`I knew it →`, reviewNext:`To review →`,
  endSim:`End of the simulation`, endSub:`questions marked "I knew it"`, newDraw:`New draw`, revisePart:p=>`Review ${p}`,
  quizTitle:`Quiz`, quizSub:`10 random questions`, score:`score`, next:`Next →`, newQuiz:`New quiz`,
  quizMsg:p=>p>=80?`Ready for the jury.`:p>=50?`Not bad, try another round.`:`Go back to the Slides tab before trying again.`,
  cardsTitle:`Flashcards`, cardsKnown:(a,b)=>`${a}/${b} known`, flipHint:`tap to flip`, iKnow:`I know it`,
  deckDone:`Deck finished`, allKnown:`All cards are known`, replay:`Replay the cards to review`, resetDeck:`Reset all`
 }
};

</script>
<script>
/* ============ ÉTAT (localStorage protégé) ============ */
const KEY = `cs-oral-g4-v1`;
let S = {slides:{}, jury:{}, cards:{}};
try { const raw = localStorage.getItem(KEY); if (raw) S = Object.assign(S, JSON.parse(raw)); } catch(e) {}
function save(){ try { localStorage.setItem(KEY, JSON.stringify(S)); } catch(e) {} }
let LANG = `fr`;
try { const l = localStorage.getItem(`cs-oral-g4-lang`); if (l===`en`||l===`fr`) LANG = l; } catch(e) {}
const T = k => UI[LANG][k];
const EN = () => LANG===`en`;
const PT = p => { const P = PARTS[p], E = PARTS_EN[p]; return EN() ? {title:E.title, task:E.task, essential:E.essential, weak:E.weak, numbers:E.numbers, sl:i=>E.slides[i]} : {title:P.title, task:P.task, essential:P.essentialFR, weak:P.weak, numbers:P.numbers, sl:i=>P.slides[i]}; };
const TL = i => EN() ? Object.assign({}, TOOLS[i], TOOLS_EN[i]) : TOOLS[i];
const QZ = q => { const i = QUIZ.indexOf(q); return EN() ? Object.assign({}, q, QUIZ_EN[i]) : q; };
const HINT = i => EN() ? JURY_HINT_EN[i] : JURY[i].fr;
const CD = i => EN() ? CARDS_EN[i] : CARDS[i];
function applyStatic(){
  document.documentElement.lang = LANG;
  document.querySelectorAll(`[data-t]`).forEach(el=>{ el.innerHTML = T(el.dataset.t); });
  document.getElementById(`methodList`).innerHTML = T(`method`).map(x=>`<li>${x}</li>`).join(``);
  document.getElementById(`lgfr`).classList.toggle(`on`, LANG===`fr`);
  document.getElementById(`lgen`).classList.toggle(`on`, LANG===`en`);
  const el = document.getElementById(`countdown`);
  const oral = new Date(2026, 11, 1); const now = new Date(); now.setHours(0,0,0,0);
  const d = Math.round((oral - now) / 86400000);
  el.textContent = d > 0 ? T(`daysLeft`)(d) : d === 0 ? T(`today`) : T(`past`);
}
function setLang(l){
  if (l===LANG) return; LANG = l;
  try { localStorage.setItem(`cs-oral-g4-lang`, l); } catch(e) {}
  const opens = [...document.querySelectorAll(`#partBody details.slide`)].map(d=>d.open);
  closeModal(); applyStatic(); renderHome(); renderPart(); renderJury(); renderQuizChips(); if (quizQs.length) showQuiz(); newDeckKeep();
  document.querySelectorAll(`#partBody details.slide`).forEach((d,i)=>{ if (opens[i]) d.open = true; });
}
const C = p => PARTS[p] ? PARTS[p].color : `#1E2A4A`;
const esc = s => String(s).replace(/&/g,`&amp;`).replace(/</g,`&lt;`).replace(/>/g,`&gt;`);

/* ============ NAVIGATION ============ */
function go(v){
  document.querySelectorAll(`.view`).forEach(x=>x.classList.toggle(`on`, x.id===`v-`+v));
  document.querySelectorAll(`nav.tabs button`).forEach(b=>b.classList.toggle(`on`, b.dataset.v===v));
  if (v===`home`) renderHome();
  window.scrollTo({top:0, behavior:`instant` in window ? `instant` : `auto`});
}



/* ============ PROGRESSION ============ */
function progress(p){
  const sl = PARTS[p].slides.filter(s=>s.keys.length);
  const sDone = sl.filter(s=>S.slides[`${p}-${s.n}`]).length;
  const qs = JURY.map((q,i)=>({q,i})).filter(x=>x.q.p===p);
  const qDone = qs.filter(x=>S.jury[x.i]===`ok`).length;
  const tot = sl.length + qs.length;
  return {pct: tot ? Math.round((sDone+qDone)/tot*100) : 0, sDone, sTot: sl.length, qDone, qTot: qs.length};
}

/* ============ ACCUEIL ============ */
function renderHome(){
  document.getElementById(`homeParts`).innerHTML = [1,2,3,4].map(p=>{
    const P = PARTS[p], g = progress(p);
    return `<button class="partcard" onclick="openPart(${p})">
      <span class="tag" style="background:${P.color}">${P.name}</span>
      <h3>${esc(P.short)}</h3>
      <div style="font-size:13px;color:var(--muted)">${esc(PT(p).title)}</div>
      <div class="bar"><i style="width:${g.pct}%;background:${P.color}"></i></div>
      <div class="pmeta">${T(`pMeta`)(g)}</div>
    </button>`;
  }).join(``);
  document.getElementById(`toolsList`).innerHTML = TOOLS.map((t0,i)=>{ const t = TL(i); return `
    <button class="card tool" onclick="openTool(${i})">
      <span class="pill" style="background:${C(t.part)}">P${t.part}</span>
      <div class="tn" style="margin-top:6px">${esc(t.name)}</div>
      <div class="td">${esc(t.authors)}</div>
    </button>`; }).join(``);
}

/* ============ MODAL ============ */
function openModal(html){ document.getElementById(`sheet`).innerHTML = `<button class="x" onclick="closeModal()">×</button>` + html; document.getElementById(`modal`).classList.add(`on`); document.getElementById(`sheet`).scrollTop = 0; }
function closeModal(){ document.getElementById(`modal`).classList.remove(`on`); if (drawTimer) { clearInterval(drawTimer); drawTimer = null; } }

function openTool(i){
  const t = TL(i);
  openModal(`<span class="pill" style="background:${C(t.part)}">${PARTS[t.part].name}</span>
    <h2>${esc(t.name)}</h2>
    <div class="card"><b>${T(`def`)}</b><p style="margin:6px 0 0">${esc(t.def)}</p></div>
    <div class="card"><b>${T(`authors`)}</b><p style="margin:6px 0 0">${esc(t.authors)}</p></div>
    <div class="card"><b>${T(`applied`)}</b><p style="margin:6px 0 0">${esc(t.applied)}</p></div>
    <button class="btn btn-navy" onclick="closeModal();openPart(${t.part})">${T(`seePart`)(PARTS[t.part].name)}</button>`);
}

function openThread(){
  const steps = T(`threadSteps`).map((x,k)=>[k+1,x[0],x[1]]);
  const q = JURY.find(x=>x.p===0);
  openModal(`<h2>${T(`threadTitle`)}</h2>
    <div class="thread">${steps.map(s=>`<div class="st"><div class="num" style="background:${C(s[0])}">${s[0]}</div><div><b style="color:var(--navy)">${esc(s[1])}</b><div style="font-size:14px">${esc(s[2])}</div></div></div>`).join(``)}</div>
    <div class="sec"><h2>${T(`pitchGlobal`)}</h2></div>
    <div class="en"><b class="lbl">${T(`sayEN`)}</b>${esc(q.a)}</div>`);
}

/* ============ PARTIES ============ */
let curPart = 1;
function openPart(p){ curPart = p; go(`parts`); renderPart(); }
function renderPart(){
  document.getElementById(`partChips`).innerHTML = [1,2,3,4].map(p=>`<button class="chip ${p===curPart?`on`:``}" onclick="curPart=${p};renderPart()">${PARTS[p].name} · ${esc(PARTS[p].short)}</button>`).join(``);
  const P = PARTS[curPart], col = P.color, X = PT(curPart);
  let h = `<div class="card" style="border-top:5px solid ${col}">
      <span class="pill" style="background:${col}">${P.name}</span>
      <h2 style="font-size:21px;margin:8px 0 10px">${esc(X.title)}</h2>
      <div class="box-task"><b>${T(`task`)}</b> ${esc(X.task)}</div>
    </div>
    <div class="card"><b style="color:var(--navy)">${T(`essential`)}</b><p class="lead" style="margin:6px 0 10px">${esc(X.essential)}</p>
      <div class="en"><b class="lbl">${T(`openingPitch`)}</b>${esc(P.pitchEN)}</div></div>`;
  h += visual(curPart);
  h += `<div class="sec"><h2>${T(`slideBySlide`)}</h2><small>${T(`tickHint`)}</small></div>`;
  h += P.slides.map((s,si)=>{
    const L = X.sl(si);
    const k = `${curPart}-${s.n}`, done = !!S.slides[k], can = s.keys.length>0;
    return `<details class="slide" style="--dot:${col}">
      <summary><span class="num" style="background:${col}">${s.n}</span><span class="st">${esc(s.t)}</span>${can?`<span class="chk ${done?`on`:``}" onclick="event.preventDefault();event.stopPropagation();toggleSlide('${k}',this)">✓</span>`:``}</summary>
      <div class="body">
        <p>${esc(L.what)}</p>
        ${L.keys.length?`<ul class="keys">${L.keys.map(x=>`<li>${esc(x)}</li>`).join(``)}</ul>`:``}
        ${s.say?`<div class="en"><b class="lbl">${T(`say`)}</b>${esc(s.say)}</div>`:``}
        ${L.trap?`<div class="trap"><b>${T(`trap`)}</b>${esc(L.trap)}</div>`:``}
      </div></details>`;
  }).join(``);
  h += `<div class="sec"><h2>${T(`weakTitle`)}</h2></div><div class="card weak">${X.weak.map(w=>`<div class="numrow"><b>${esc(w[0])}</b><div style="font-size:14px;margin-top:2px">${esc(w[1])}</div></div>`).join(``)}</div>`;
  h += `<div class="sec"><h2>${T(`numbersTitle`)}</h2><button class="mini" onclick="toggleNums()" id="numBtn">${numsHidden?T(`showAns`):T(`hideAns`)}</button></div>
    <div class="card" id="numBox">${X.numbers.map(n=>`<div class="numrow"><span>${esc(n[0])}</span><span class="v ${numsHidden?`hide`:``}" onclick="this.classList.toggle('hide')">${esc(n[1])}</span></div>`).join(``)}</div>
    <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:6px">
      <button class="btn btn-navy" onclick="juryPart=${curPart};go('jury');renderJury()">${T(`juryBtn`)(P.name)}</button>
      <button class="btn btn-out" onclick="quizPart=${curPart};go('quiz');newQuiz()">${T(`quizBtn`)(P.name)}</button>
    </div>`;
  document.getElementById(`partBody`).innerHTML = h;
}
function toggleSlide(k, el){ S.slides[k] = !S.slides[k]; if(!S.slides[k]) delete S.slides[k]; el.classList.toggle(`on`, !!S.slides[k]); save(); }
let numsHidden = false;
function toggleNums(){ numsHidden = !numsHidden; document.querySelectorAll(`#numBox .v`).forEach(v=>v.classList.toggle(`hide`, numsHidden)); document.getElementById(`numBtn`).textContent = numsHidden ? T(`showAns`) : T(`hideAns`); }

/* ============ VISUELS ============ */
const tx = x => x>70 ? `translate(-100%,-50%)` : x<30 ? `translate(0,-50%)` : `translate(-50%,-50%)`;
function visual(p){
  if (p===1){
    const D = T(`bcgDots`); const pos = {1:[70,38,D[1]],2:[80,76,D[2]],3:[20,38,D[3]],4:[24,78,D[4]],5:[38,22,D[5]],6:[84,22,D[6]]};
    return `<div class="sec"><h2>${T(`bcgTitle`)}</h2></div><div class="card">
      <div class="matrix">
        <div class="q" style="left:0;top:0;background:#FBF3E4;color:#B07015">${T(`qFrag`)}</div>
        <div class="q" style="right:0;top:0;background:#F6EAF3;color:#8E3A78;text-align:right">${T(`qSpec`)}</div>
        <div class="q" style="left:0;bottom:0;background:#F1F1F3;color:#5E5E72;display:flex;align-items:flex-end">${T(`qStal`)}</div>
        <div class="q" style="right:0;bottom:0;background:#FDEEE8;color:#C0533A;display:flex;align-items:flex-end;justify-content:flex-end">${T(`qVol`)}</div>
        ${Object.values(pos).map(v=>`<span class="dot" style="left:${v[0]>70?v[0]+6:v[0]<30?v[0]-6:v[0]}%;top:${v[1]}%;transform:${tx(v[0])};background:var(--navy)">${v[2]}</span>`).join(``)}
      </div>
      <div class="axis">${T(`bcgAxis`)}</div>
      <p style="font-size:13.5px;margin:10px 0 0">${T(`bcgNote`)}</p></div>`;
  }
  if (p===2){
    const N = T(`groups`); const G = {1:[N[1],`#4F4898`],2:[N[2],`#E76F51`],3:[N[3],`#A8458F`],4:[N[4],`#3D5A80`],5:[N[5],`#5B8C3E`],6:[N[6],`#D98E1F`],7:[N[7],`#2A9D8F`]};
    const m1 = {1:[81,40],2:[82,72],3:[81,10],4:[36,22],5:[27,54],6:[22,90],7:[19,73]};
    const m2 = {1:[38,30],2:[20,11],3:[56,87],4:[56,55],5:[21,62],6:[18,87],7:[82,12]};
    const mk = (m,xl,yl)=>`<div class="matrix" style="aspect-ratio:1.3/1">${Object.entries(m).map(([k,v])=>`<span class="dot" style="left:${v[0]>70?Math.min(v[0]+8,97):v[0]<30?Math.max(v[0]-8,3):v[0]}%;top:${v[1]}%;transform:${tx(v[0])};background:${G[k][1]}">${G[k][0]}</span>`).join(``)}</div><div class="axis">→ ${xl} · ↑ ${yl}</div>`;
    return `<div class="sec"><h2>${T(`mapsTitle`)}</h2></div>
      <div class="card"><b style="color:var(--navy)">${T(`map1`)}</b>${mk(m1,T(`m1x`),T(`m1y`))}</div>
      <div class="card"><b style="color:var(--navy)">${T(`map2`)}</b>${mk(m2,T(`m2x`),T(`m2y`))}</div>`;
  }
  if (p===3){
    const f = T(`dec`), rw = T(`rows`), ns = T(`ns`);
    return `<div class="sec"><h2>${T(`dupontTitle`)}</h2></div><div class="card tscroll">
      <table class="t"><tr><th>${T(`ratio`)}</th><th style="background:#E76F51">King Jouet</th><th style="background:#3D5A80">Smyths</th><th style="background:#2A9D8F">LGR</th></tr>
      <tr><td>${rw[0]}</td><td>${f(`0.98%`)}</td><td class="y">${f(`1.66%`)}</td><td class="n">${f(`-2.33%`)}</td></tr>
      <tr><td>${rw[1]}</td><td>${f(`1.37`)}</td><td class="y">${f(`2.93`)}</td><td>${f(`1.87`)}</td></tr>
      <tr><td><b>${rw[2]}</b></td><td><b>${f(`1.34%`)}</b></td><td class="y">${f(`4.87%`)}</td><td class="n">${f(`-4.38%`)}</td></tr>
      <tr><td>${rw[3]}</td><td class="m">${f(`6.40`)}</td><td>${f(`1.66`)}</td><td>${ns}</td></tr>
      <tr><td><b>${rw[4]}</b></td><td class="y">${f(`8.6%`)}</td><td><b>${f(`8.1%`)}</b></td><td>${ns}</td></tr></table>
      <p style="font-size:13.5px;margin:10px 0 0">${T(`kjTime`)}</p></div>`;
  }
  if (p===4){
    const nm = T(`vrioNames`), O = T(`outc`);
    const raw = [[`y`,`y`,`y`,`y`,`dur`],[`y`,`n`,`n`,`y`,`par`],[`n`,`n`,`n`,`m`,`dis`],[`y`,`n`,`m`,`y`,`par`],[`y`,`m`,`y`,`y`,`tmp`],[`y`,`n`,`m`,`y`,`par`],[`y`,`y`,`y`,`y`,`dur`],[`y`,`y`,`m`,`m`,`tmp`],[`y`,`n`,`n`,`y`,`par`],[`y`,`y`,`n`,`y`,`tmp`],[`y`,`y`,`y`,`y`,`dur`]];
    const oc = {dur:`#2A9D8F`,par:`#5E5E72`,dis:`#E76F51`,tmp:`#D98E1F`};
    const rows = raw.map((x,k)=>[nm[k],x[0],x[1],x[2],x[3],O[x[4]],oc[x[4]]]);
    const sy = {y:`✓`,n:`✗`,m:`~`};
    return `<div class="sec"><h2>${T(`vrioTitle`)}</h2></div><div class="card tscroll">
      <table class="t"><tr><th>${T(`vrioHead`)}</th><th>V</th><th>R</th><th>I</th><th>O</th><th>${T(`outcome`)}</th></tr>
      ${rows.map(r=>`<tr><td>${r[0]}</td>${[1,2,3,4].map(i=>`<td class="${r[i]}">${sy[r[i]]}</td>`).join(``)}<td><span class="badge" style="background:${r[6]};color:#fff">${r[5]}</span></td></tr>`).join(``)}</table>
      <div class="legend">${T(`legend`).map(x=>`<span>${x}</span>`).join(``)}</div></div>`;
  }
  return ``;
}

/* ============ JURY ============ */
let juryPart = `all`, juryMode = `all`;
function renderJury(){
  const opts = [[`all`,T(`all`)],[1,`Part 1`],[2,`Part 2`],[3,`Part 3`],[4,`Part 4`],[0,T(`transversal`)]];
  document.getElementById(`juryChips`).innerHTML = opts.map(o=>`<button class="chip ${String(juryPart)===String(o[0])?`on`:``}" onclick="juryPart=${typeof o[0]===`number`?o[0]:`'all'`};renderJury()">${o[1]}</button>`).join(``);
  const fo = [[`all`,T(`fAll`)],[`todo`,T(`fTodo`)],[`bad`,T(`fBad`)]];
  document.getElementById(`juryFilter`).innerHTML = fo.map(o=>`<button class="chip ${juryMode===o[0]?`on`:``}" onclick="juryMode='${o[0]}';renderJury()">${o[1]}</button>`).join(``);
  let list = JURY.map((q,i)=>({q,i})).filter(x=>juryPart===`all`||x.q.p===juryPart);
  const known = list.filter(x=>S.jury[x.i]===`ok`).length;
  document.getElementById(`juryStat`).textContent = T(`known`)(known, list.length);
  if (juryMode===`todo`) list = list.filter(x=>S.jury[x.i]!==`ok`);
  if (juryMode===`bad`) list = list.filter(x=>S.jury[x.i]===`bad`);
  document.getElementById(`juryList`).innerHTML = list.length ? list.map(({q,i})=>qcardHTML(q,i)).join(``) : `<div class="card">${T(`empty`)}</div>`;
}
function qcardHTML(q,i){
  const st = S.jury[i];
  return `<div class="qcard" id="qc${i}">
    <span class="pill" style="background:${C(q.p)}">${q.p?`P`+q.p:T(`global`)}</span>
    <div class="q" style="margin-top:6px">${esc(q.q)}</div>
    <div class="hint">${T(`keyIdea`)}${esc(HINT(i))}</div>
    <div class="ans"><div class="en"><b class="lbl">${T(`modelAns`)}</b>${esc(q.a)}</div></div>
    <div class="qrow">
      <button class="mini" onclick="document.getElementById('qc${i}').classList.toggle('open')">${T(`toggleAns`)}</button>
      <button class="mini ok ${st===`ok`?`sel`:``}" onclick="markJ(${i},'ok')">${T(`knew`)}</button>
      <button class="mini bad ${st===`bad`?`sel`:``}" onclick="markJ(${i},'bad')">${T(`review`)}</button>
    </div></div>`;
}
function markJ(i,v){ S.jury[i] = S.jury[i]===v ? undefined : v; if(!S.jury[i]) delete S.jury[i]; save();
  const el = document.getElementById(`qc`+i); if (el && !document.getElementById(`modal`).classList.contains(`on`)) { renderJury(); } else if (el) { el.outerHTML = qcardHTML(JURY[i], i); } }

/* ============ TIRAGE AU SORT (SIMULATION ORAL) ============ */
let drawTimer = null, drawQs = [], drawIdx = 0, drawP = 1;
function startDraw(){
  drawP = 1 + Math.floor(Math.random()*4);
  const P = PARTS[drawP];
  openModal(`<div style="text-align:center;padding:10px 0">
      <div style="font-size:13px;color:var(--muted);font-weight:700;letter-spacing:.06em;text-transform:uppercase">${T(`drawn`)}</div>
      <h2 style="font-size:34px;color:${P.color};margin:6px 0">${P.name}</h2>
      <div style="font-weight:600;color:var(--navy)">${esc(PT(drawP).title)}</div></div>
    <div class="card"><b style="color:var(--navy)">${T(`step1`)}</b>
      <div class="timer" id="tm">1:00</div>
      <div style="display:flex;gap:8px;justify-content:center"><button class="btn btn-navy" onclick="runTimer(60)">${T(`startTimer`)}</button><button class="btn btn-out" onclick="document.getElementById('pitchAns').style.display='block'">${T(`seePitch`)}</button></div>
      <div class="en" id="pitchAns" style="display:none;margin-top:10px"><b class="lbl">${T(`modelPitch`)}</b>${esc(P.pitchEN)}</div></div>
    <button class="btn btn-navy" style="width:100%;justify-content:center" onclick="drawQuestions()">${T(`step2`)}</button>
    <div style="text-align:center;margin-top:10px"><button class="mini" onclick="startDraw()">${T(`redraw`)}</button></div>`);
}
function runTimer(sec){
  if (drawTimer) clearInterval(drawTimer);
  let t = sec; const el = document.getElementById(`tm`);
  const f = ()=>{ if(!el) return; el.textContent = `${Math.floor(t/60)}:${String(t%60).padStart(2,`0`)}`; el.style.color = t<=10 ? `var(--bad)` : `var(--navy)`; };
  f(); drawTimer = setInterval(()=>{ t--; f(); if (t<=0){ clearInterval(drawTimer); drawTimer=null; el.textContent = T(`stop`); } }, 1000);
}
function drawQuestions(){
  if (drawTimer){ clearInterval(drawTimer); drawTimer=null; }
  const pool = JURY.map((q,i)=>({q,i})).filter(x=>x.q.p===drawP);
  drawQs = pool.sort(()=>Math.random()-.5).slice(0,5); drawIdx = 0; showDrawQ();
}
function showDrawQ(){
  if (drawIdx >= drawQs.length){
    const ok = drawQs.filter(x=>S.jury[x.i]===`ok`).length;
    openModal(`<h2>${T(`endSim`)}</h2><div class="score">${ok}/${drawQs.length}</div><p style="text-align:center;color:var(--muted)">${T(`endSub`)}</p>
      <div style="display:flex;gap:8px;flex-wrap:wrap;justify-content:center"><button class="btn btn-navy" onclick="startDraw()">${T(`newDraw`)}</button><button class="btn btn-out" onclick="closeModal();openPart(${drawP})">${T(`revisePart`)(PARTS[drawP].name)}</button></div>`);
    return;
  }
  const {q,i} = drawQs[drawIdx];
  openModal(`<div style="font-size:13px;color:var(--muted);font-weight:700">${T(`qOf`)(PARTS[drawP].name, drawIdx+1, drawQs.length)}</div>
    <h2 style="font-size:20px;margin-top:6px">${esc(q.q)}</h2>
    <div class="card"><div class="timer" id="tm">0:45</div><div style="text-align:center"><button class="btn btn-navy" onclick="runTimer(45)">${T(`answer45`)}</button></div></div>
    <div id="dAns" style="display:none"><div class="hint" style="font-size:13px;color:var(--muted);margin-bottom:6px">${T(`keyIdea`)}${esc(HINT(i))}</div><div class="en"><b class="lbl">${T(`modelAns`)}</b>${esc(q.a)}</div></div>
    <div class="qrow" style="justify-content:center">
      <button class="mini" onclick="document.getElementById('dAns').style.display='block'">${T(`seeAns`)}</button>
      <button class="mini ok" onclick="S.jury[${i}]='ok';save();drawIdx++;showDrawQ()">${T(`knewNext`)}</button>
      <button class="mini bad" onclick="S.jury[${i}]='bad';save();drawIdx++;showDrawQ()">${T(`reviewNext`)}</button>
    </div>`);
}

/* ============ QUIZ ============ */
let quizPart = `all`, quizQs = [], quizIdx = 0, quizScore = 0, quizAnswered = false;
function renderQuizChips(){
  const opts = [[`all`,T(`all`)],[1,`Part 1`],[2,`Part 2`],[3,`Part 3`],[4,`Part 4`]];
  document.getElementById(`quizChips`).innerHTML = opts.map(o=>`<button class="chip ${String(quizPart)===String(o[0])?`on`:``}" onclick="quizPart=${typeof o[0]===`number`?o[0]:`'all'`};newQuiz()">${o[1]}</button>`).join(``);
}
function newQuiz(){
  renderQuizChips();
  const pool = QUIZ.filter(q=>quizPart===`all`||q.p===quizPart).slice();
  quizQs = pool.sort(()=>Math.random()-.5).slice(0,10); quizIdx = 0; quizScore = 0; showQuiz();
}
function showQuiz(){
  const box = document.getElementById(`quizBody`);
  if (quizIdx >= quizQs.length){
    const pct = Math.round(quizScore/quizQs.length*100);
    box.innerHTML = `<div class="card" style="text-align:center"><div class="score">${quizScore}/${quizQs.length}</div>
      <p style="color:var(--muted)">${T(`quizMsg`)(pct)}</p>
      <button class="btn btn-navy" onclick="newQuiz()">${T(`newQuiz`)}</button></div>`;
    return;
  }
  const q = QZ(quizQs[quizIdx]); quizAnswered = false;
  box.innerHTML = `<div class="card">
    <div style="display:flex;justify-content:space-between;align-items:center"><span class="pill" style="background:${C(q.p)}">P${q.p}</span><span style="font-size:13px;color:var(--muted)">${quizIdx+1}/${quizQs.length} · ${T(`score`)} ${quizScore}</span></div>
    <div class="bar"><i style="width:${quizIdx/quizQs.length*100}%;background:var(--navy)"></i></div>
    <h3 style="font-size:18px;margin:14px 0 12px">${esc(q.q)}</h3>
    <div id="opts">${q.o.map((o,j)=>`<button class="opt" onclick="answer(${j})">${esc(o)}</button>`).join(``)}</div>
    <div id="qx"></div></div>`;
}
function answer(j){
  if (quizAnswered) return; quizAnswered = true;
  const q = QZ(quizQs[quizIdx]), btns = document.querySelectorAll(`#opts .opt`);
  btns[q.a].classList.add(`right`); if (j!==q.a) btns[j].classList.add(`wrong`); else quizScore++;
  document.getElementById(`qx`).innerHTML = `<div class="expl">${j===q.a?`✅ `:`❌ `}${esc(q.e)}</div><button class="btn btn-navy" style="margin-top:10px" onclick="quizIdx++;showQuiz()">${T(`next`)}</button>`;
}

/* ============ FLASHCARDS ============ */
let cardPart = `all`, deck = [], cardIdx = 0;
function newDeck(){
  renderCardChips();
  deck = CARDS.map((c,i)=>({c,i})).filter(x=>(cardPart===`all`||x.c.p===cardPart) && !S.cards[x.i]).sort(()=>Math.random()-.5);
  cardIdx = 0; showCard();
}
function newDeckKeep(){ renderCardChips(); showCard(); }
function renderCardChips(){
  const opts = [[`all`,T(`all`)],[1,`Part 1`],[2,`Part 2`],[3,`Part 3`],[4,`Part 4`]];
  document.getElementById(`cardChips`).innerHTML = opts.map(o=>`<button class="chip ${String(cardPart)===String(o[0])?`on`:``}" onclick="cardPart=${typeof o[0]===`number`?o[0]:`'all'`};newDeck()">${o[1]}</button>`).join(``);
}
function showCard(){
  const tot = CARDS.filter(c=>cardPart===`all`||c.p===cardPart).length;
  const known = CARDS.map((c,i)=>({c,i})).filter(x=>(cardPart===`all`||x.c.p===cardPart) && S.cards[x.i]).length;
  document.getElementById(`cardStat`).textContent = T(`cardsKnown`)(known, tot);
  const box = document.getElementById(`cardBody`);
  if (!deck.length || cardIdx >= deck.length){
    box.innerHTML = `<div class="card" style="text-align:center"><h3 style="margin-bottom:8px">${deck.length?T(`deckDone`):T(`allKnown`)}</h3>
      <div style="display:flex;gap:8px;justify-content:center;flex-wrap:wrap"><button class="btn btn-navy" onclick="newDeck()">${T(`replay`)}</button><button class="btn btn-out" onclick="resetCards()">${T(`resetDeck`)}</button></div></div>`;
    return;
  }
  const {i} = deck[cardIdx], c = Object.assign({p:CARDS[i].p}, CD(i));
  box.innerHTML = `<div class="flip" id="fl" onclick="this.classList.toggle('on')"><div class="inner">
      <div class="face front"><small>${PARTS[c.p].name} · ${T(`flipHint`)}</small><h3>${esc(c.f)}</h3></div>
      <div class="face back"><small>${cardIdx+1}/${deck.length}</small>${esc(c.b)}</div></div></div>
    <div class="qrow" style="justify-content:center">
      <button class="mini bad" onclick="cardIdx++;showCard()">${T(`review`)}</button>
      <button class="mini ok" onclick="S.cards[${i}]=1;save();cardIdx++;showCard()">${T(`iKnow`)}</button>
    </div>`;
}
function resetCards(){ CARDS.forEach((c,i)=>{ if(cardPart===`all`||c.p===cardPart) delete S.cards[i]; }); save(); newDeck(); }
function resetAll(){ if (!confirm(T(`resetConfirm`))) return; S = {slides:{}, jury:{}, cards:{}}; save(); renderHome(); }

/* ============ INIT ============ */
applyStatic(); renderHome(); renderPart(); renderJury(); newQuiz(); newDeck();
</script>
</body>
</html>
